  chargesCurrent: Math.max(0, Math.min(Math.max(0, parseInt(it.chargesMax, 10) || 0), parseInt(it.chargesCurrent, 10) || 0)),

const renderIconNode = (n, key) => {
  const tag = n[0];
  const attrs = n[1] && typeof n[1] === "object" && !Array.isArray(n[1]) ? n[1] : {};
  const kids = Array.isArray(n[2]) ? n[2].map((c, i) => renderIconNode(c, i)) : [];
  return React.createElement(tag, { ...attrs, key }, ...kids);
};
const makeIcon = (...names) => {
  return function IconComponent({ className = "" }) {
    try {
      const icons = window.lucide && window.lucide.icons || {};
      const node = names.map((n) => icons[n]).find(Boolean);
      if (!node || !Array.isArray(node)) return React.createElement("span", { className });
      const children = node[0] === "svg" ? Array.isArray(node[2]) ? node[2] : [] : node;
      return React.createElement(
        "svg",
        {
          xmlns: "http://www.w3.org/2000/svg",
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className
        },
        children.map((c, i) => renderIconNode(c, i))
      );
    } catch (e) {
      return React.createElement("span", { className });
    }
  };
};

function getTotalCopper(coins) {
  return (coins.pp || 0) * COIN_VALUES.pp + (coins.gp || 0) * COIN_VALUES.gp + (coins.sp || 0) * COIN_VALUES.sp + (coins.cp || 0) * COIN_VALUES.cp;
}
function copperToCoins(totalCp) {
  let rem = Math.max(0, Math.round(totalCp));
  const pp = Math.floor(rem / COIN_VALUES.pp);
  rem %= COIN_VALUES.pp;
  const gp = Math.floor(rem / COIN_VALUES.gp);
  rem %= COIN_VALUES.gp;
  const sp = Math.floor(rem / COIN_VALUES.sp);
  rem %= COIN_VALUES.sp;
  const cp = rem;
  return { pp, gp, sp, cp };
}
function formatCurrency(totalCp, standard = "silver") {
  if (totalCp === 0) return "0 KM";
  const c = copperToCoins(totalCp);
  const parts = [];
  if (c.pp > 0) parts.push(`${c.pp} PM`);
  if (c.gp > 0) parts.push(`${c.gp} GM`);
  if (c.sp > 0) parts.push(`${c.sp} SM`);
  if (c.cp > 0) parts.push(`${c.cp} KM`);
  return parts.join(", ");
}
function getItemCostCp(item, standard) {
  if (item.alwaysGold || standard === "gold") {
    return item.phbUnits * 100;
  } else {
    return item.phbUnits * 10;
  }
}
function getCoinWeight(coins) {
  const count = (coins.pp || 0) + (coins.gp || 0) + (coins.sp || 0) + (coins.cp || 0);
  const kgNum = count / 50 * 0.5;
  return { count, kgNum, kg: kgNum.toFixed(2) };
}
function getInventoryItemsWeight(items) {
  return (items || []).reduce((acc, it) => acc + (parseFloat(it.weight) || 0) * (parseInt(it.qty, 10) || 1), 0);
}
function getEncumbranceStats(char, useVariant = false) {
  const str = Math.max(1, parseInt(char.strength, 10) || 10);
  const coinKg = getCoinWeight(char.coins || {}).kgNum;
  const gearKg = getInventoryItemsWeight(char.inventory || []);
  const totalKg = coinKg + gearKg;

  const carryMaxKg = str * 7.5;
  const pushDragMaxKg = str * 15;
  const variantEncumberedKg = str * 2.5;
  const variantHeavilyKg = str * 5.0;

  let status = "normal";
  let statusLabel = "Unbelastet";
  let speedPenalty = "Kein Malus";
  let barColor = "bg-emerald-500";
  let textColor = "text-emerald-400";

  if (totalKg > pushDragMaxKg) {
    status = "overloaded";
    statusLabel = "Überladen (Bewegungsunfähig)";
    speedPenalty = "Bewegung 0 m (über Hebegrenze!)";
    barColor = "bg-red-600";
    textColor = "text-red-400";
  } else if (totalKg > carryMaxKg) {
    status = "drag_only";
    statusLabel = "Über Tragkraft (Nur Stoßen/Ziehen)";
    speedPenalty = "Bewegung auf 1,5 m (5 Fuß) reduziert";
    barColor = "bg-red-500";
    textColor = "text-red-400";
  } else if (useVariant && totalKg > variantHeavilyKg) {
    status = "heavily_encumbered";
    statusLabel = "Schwer belastet (Variante)";
    speedPenalty = "-6 m (-20 Fuß) Bewegung & Nachteil auf STR/GES/KON";
    barColor = "bg-amber-500";
    textColor = "text-amber-300";
  } else if (useVariant && totalKg > variantEncumberedKg) {
    status = "encumbered";
    statusLabel = "Belastet (Variante)";
    speedPenalty = "-3 m (-10 Fuß) Bewegung";
    barColor = "bg-amber-400";
    textColor = "text-amber-300";
  } else if (totalKg >= carryMaxKg * 0.75) {
    status = "near_limit";
    statusLabel = "Gut beladen (> 75 %)";
    speedPenalty = "Kein Malus (nahe Tragkraftgrenze)";
    barColor = "bg-amber-400";
    textColor = "text-amber-300";
  }

  const pctOfCarry = carryMaxKg > 0 ? Math.min(100, (totalKg / carryMaxKg) * 100) : 0;

  return {
    str,
    coinKg,
    gearKg,
    totalKg,
    carryMaxKg,
    pushDragMaxKg,
    variantEncumberedKg,
    variantHeavilyKg,
    status,
    statusLabel,
    speedPenalty,
    barColor,
    textColor,
    pctOfCarry
  };
}

          const listKey = k === "logs" || k === "pendingRequests";
          if (listKey || data[k] != null) {
            next[k] = SYNC_NORMALIZERS[k](data[k]);
            lastSynced.current[k] = JSON.stringify(next[k]);
          }
        });
        if (next.characters) setCharacters(next.characters);
        if (next.bagOfHolding) setBagOfHolding(next.bagOfHolding);
        if (next.bastion) setBastion(next.bastion);
        if (next.shopTabs && next.shopTabs.length > 0) setShopTabs(next.shopTabs);
        if (next.logs) setLogs(next.logs);
        if (next.pendingRequests) setPendingRequests(next.pendingRequests);
        if (next.standard) setStandard(next.standard);
        if (next.campaignMeta) setCampaignMeta(next.campaignMeta);
      }
      setSyncStatus("live");
      setLoaded(true);
    };
    ref.on("value", handleSnapshot, (err) => {
      console.error("Firebase Lesefehler:", err);
      clearTimeout(timer);
      setSyncStatus("error");
      setLoaded(true);
    });
    return () => {
      clearTimeout(timer);
      ref.off("value", handleSnapshot);
    };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(
        "dnd55_economy_state_v3",
        JSON.stringify({ characters, bagOfHolding, bastion, shopTabs, logs, pendingRequests, standard, campaignMeta, dmPassword })
      );
    } catch (e) {
      console.error("Fehler beim Speichern:", e);
    }
    if (syncStatus !== "live" || !dbRef.current) return;
    const values = { characters, bagOfHolding, bastion, shopTabs, logs, pendingRequests, standard, campaignMeta };
    const updates = {};
    SYNC_KEYS.forEach((k) => {
      const json = JSON.stringify(values[k]);
      if (lastSynced.current[k] !== json) {
        updates[k] = cleanForDb(values[k]);
        lastSynced.current[k] = json;
      }
    });
    if (Object.keys(updates).length > 0) {
      dbRef.current.update(updates).catch((e) => {
        console.error("Firebase Schreibfehler:", e);
        setSyncStatus("error");
      });
    }
  }, [loaded, syncStatus, characters, bagOfHolding, bastion, shopTabs, logs, pendingRequests, standard, campaignMeta, dmPassword]);

  const addLog = (actor, type, title, amountText, source = "Spieler", undoData = null) => {
    const newEntry = {
      id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),

      amountText,
      source,
      undoData,

  const handleUndoLogEntry = (entry) => {
    if (!entry || entry.reverted || !entry.undoData) return;
    if (!window.confirm(`Transaktion „${entry.title}“ (${entry.actor}: ${entry.amountText}) wirklich rückgängig machen?`)) return;

    const u = entry.undoData;
    if (u.kind === "single") {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== u.charId) return c;
        const nextCp = Math.max(0, getTotalCopper(c.coins) + (u.deltaCp || 0));
        const nextNotes = Math.max(0, (c.bankNotesGp || 0) + (u.deltaBankNotesGp || 0));
        let nextUpgrades = c.upgrades || [];
        if (u.removeUpgrade) {
          const idx = nextUpgrades.lastIndexOf(u.removeUpgrade);
          if (idx !== -1) {
            nextUpgrades = nextUpgrades.slice();
            nextUpgrades.splice(idx, 1);
          }
        }
        return {
          ...c,
          coins: copperToCoins(nextCp),
          bankNotesGp: nextNotes,
          upgrades: nextUpgrades,
          ...(u.restoreLifestyle ? { lifestyle: u.restoreLifestyle } : {})
        };
      }));
    } else if (u.kind === "multi" && Array.isArray(u.changes)) {
      setCharacters((prev) => prev.map((c) => {
        const ch = u.changes.find((x) => x.charId === c.id);
        if (!ch) return c;
        const nextCp = Math.max(0, getTotalCopper(c.coins) + (ch.deltaCp || 0));
        return { ...c, coins: copperToCoins(nextCp) };
      }));
    }

    const revertStamp = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    setLogs((prev) => {
      const updated = prev.map((l) => l.id === entry.id ? { ...l, reverted: true } : l);
      const undoNotice = {
        id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        actor: entry.actor,
        type: "dm_event",
        title: `Storniert: ${entry.title}`,
        amountText: "Rückgängig",
        source: "DM-Storno",
        undoData: null,
        reverted: false,
        timestamp: revertStamp
      };
      return [undoNotice, ...updated.slice(0, 99)];
    });
    notify(`Buchung „${entry.title}“ wurde rückgängig gemacht.`);

  // --- MODUL 1: INVENTAR, TRAGLAST & ATTUNEMENT LOGIK ---
  const mergeOrAppendItem = (list, newItem) => {
    const norm = normalizeInventoryItem(newItem);
    if (!norm.requiresAttunement && norm.chargesMax === 0) {
      const existingIdx = list.findIndex(
        (x) =>
          x.name.trim().toLowerCase() === norm.name.trim().toLowerCase() &&
          Math.abs((parseFloat(x.weight) || 0) - norm.weight) < 0.001 &&
          !!x.isMagical === norm.isMagical &&
          !x.isAttuned &&
          (x.chargesMax || 0) === 0
      );
      if (existingIdx !== -1) {
        const copy = list.slice();
        copy[existingIdx] = {
          ...copy[existingIdx],
          qty: (parseInt(copy[existingIdx].qty, 10) || 1) + norm.qty
        };
        return copy;
      }
    }
    return [...list, norm];
  };

  const handleToggleAttunement = (charId, itemId) => {
    const targetChar = characters.find((c) => c.id === charId);
    if (!targetChar) return;
    const item = (targetChar.inventory || []).find((i) => i.id === itemId);
    if (!item || !item.requiresAttunement) return;

    if (!item.isAttuned) {
      const currentAttunedCount = (targetChar.inventory || []).filter((i) => i.requiresAttunement && i.isAttuned).length;
      if (currentAttunedCount >= 3) {
        notify("Maximal 3 eingestimmte Gegenstände möglich! Löse zuerst eine bestehende Einstimmung.", "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => it.id === itemId ? { ...it, isAttuned: true } : it)
        };
      }));
      addLog(targetChar.name, "inventory", `Eingestimmt: ${item.name}`, "Attunement +1", authMode === "dm" ? "DM" : "Spieler");
      notify(`Auf „${item.name}“ eingestimmt (${currentAttunedCount + 1}/3 Slots).`);
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => it.id === itemId ? { ...it, isAttuned: false } : it)
        };

      addLog(targetChar.name, "inventory", `Einstimmung gelöst: ${item.name}`, "Attunement -1", authMode === "dm" ? "DM" : "Spieler");
      notify(`Einstimmung auf „${item.name}“ gelöst.`);

  const handleAdjustItemCharges = (sourceKind, charId, itemId, delta) => {
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || []).map((it) => {
          if (it.id !== itemId) return it;
          const next = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
          return { ...it, chargesCurrent: next };
        })
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => {
            if (it.id !== itemId) return it;
            const next = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
            return { ...it, chargesCurrent: next };
          })
        };
      }));
    }
  };

  const handleAdjustItemQty = (sourceKind, charId, itemId, delta) => {
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || [])
          .map((it) => it.id === itemId ? { ...it, qty: (it.qty || 1) + delta } : it)
          .filter((it) => it.qty > 0)
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || [])
            .map((it) => it.id === itemId ? { ...it, qty: (it.qty || 1) + delta } : it)
            .filter((it) => it.qty > 0)
        };
      }));
    }
  };

  const handleDeleteInventoryItem = (sourceKind, charId, item) => {
    if (!window.confirm(`„${item.name}“ (${item.qty}x) wirklich aus dem Inventar entfernen?`)) return;
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || []).filter((it) => it.id !== item.id)
      }));
      addLog("Nimmervoller Beutel", "inventory", `Entfernt: ${item.name} (${item.qty}x)`, "-", authMode === "dm" ? "DM" : "Spieler");

      const owner = characters.find((c) => c.id === charId);
      setCharacters((prev) => prev.map((c) => c.id === charId ? { ...c, inventory: (c.inventory || []).filter((it) => it.id !== item.id) } : c));

  const handleTransferInventoryItem = (fromKind, fromCharId, item, toDestination, moveQtyRaw) => {
    if (!item || !toDestination) return;
    const maxQty = Math.max(1, parseInt(item.qty, 10) || 1);
    const moveQty = Math.max(1, Math.min(maxQty, parseInt(moveQtyRaw, 10) || 1));

    if (toDestination === "__bag_of_holding") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = (parseFloat(item.weight) || 0) * moveQty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Nimmervoller Beutel überladen! (${(currentBagKg + addedKg).toFixed(1)} / ${cap} kg – Beutel würde reißen!)`, "error");
        return;
      }
    }

    const movedItemCopy = normalizeInventoryItem({
      ...item,
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      qty: moveQty,
      isAttuned: false
    });

    const sourceLabel = fromKind === "bag"
      ? "Nimmervoller Beutel"
      : (characters.find((c) => c.id === fromCharId) || {}).name || "Unbekannt";
    const destLabel = toDestination === "__bag_of_holding"
      ? "Nimmervoller Beutel"
      : (characters.find((c) => c.id === toDestination) || {}).name || "Empfänger";

    if (fromKind === "bag") {
      setBagOfHolding((prev) => {
        const reduced = (prev.items || [])
          .map((it) => it.id === item.id ? { ...it, qty: it.qty - moveQty } : it)
          .filter((it) => it.qty > 0);
        return { ...prev, items: reduced };
      });
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== fromCharId) return c;
        const reduced = (c.inventory || [])
          .map((it) => it.id === item.id ? { ...it, qty: it.qty - moveQty } : it)
          .filter((it) => it.qty > 0);
        return { ...c, inventory: reduced };
      }));
    }

    if (toDestination === "__bag_of_holding") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: mergeOrAppendItem(prev.items || [], movedItemCopy)
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== toDestination) return c;
        return { ...c, inventory: mergeOrAppendItem(c.inventory || [], movedItemCopy) };
      }));
    }

    addLog(
      sourceLabel,
      "inventory",
      `Item-Übergabe: ${moveQty}× ${item.name} → ${destLabel}`,
      `${((parseFloat(item.weight) || 0) * moveQty).toFixed(2)} kg`,
      authMode === "dm" ? "DM" : "Spieler"
    );
    notify(`${moveQty}× „${item.name}“ an ${destLabel} übergeben.`);
  };

  const handlePlayerAddSelfItem = (e, targetKind, targetCharId) => {
    e.preventDefault();
    const name = playerNewItemForm.name.trim();
    if (!name) {
      notify("Bitte einen Gegenstandsnamen eingeben.", "error");
      return;
    }
    const newItem = normalizeInventoryItem({
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      name,
      weight: parseFloat(playerNewItemForm.weight) || 0,
      qty: Math.max(1, parseInt(playerNewItemForm.qty, 10) || 1),
      isMagical: !!playerNewItemForm.isMagical,
      requiresAttunement: !!(playerNewItemForm.isMagical && playerNewItemForm.requiresAttunement),
      isAttuned: false,
      chargesMax: Math.max(0, parseInt(playerNewItemForm.chargesMax, 10) || 0),
      chargesCurrent: Math.max(0, parseInt(playerNewItemForm.chargesMax, 10) || 0),
      description: playerNewItemForm.description.trim()
    });

    if (targetKind === "bag") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = newItem.weight * newItem.qty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Nimmervoller Beutel würde das Limit von ${cap} kg überschreiten!`, "error");
        return;
      }
      setBagOfHolding((prev) => ({ ...prev, items: mergeOrAppendItem(prev.items || [], newItem) }));
      addLog("Nimmervoller Beutel", "inventory", `Hinzugefügt: ${newItem.qty}× ${newItem.name}`, `${addedKg.toFixed(2)} kg`, "Spieler");
    } else {
      const targetChar = characters.find((c) => c.id === targetCharId);
      setCharacters((prev) => prev.map((c) => c.id === targetCharId ? { ...c, inventory: mergeOrAppendItem(c.inventory || [], newItem) } : c));
      addLog(targetChar ? targetChar.name : "Inventar", "inventory", `Hinzugefügt: ${newItem.qty}× ${newItem.name}`, `${(newItem.weight * newItem.qty).toFixed(2)} kg`, "Spieler");
    }

    setPlayerNewItemForm({
      name: "",
      weight: "0.5",
      qty: "1",
      isMagical: false,
      requiresAttunement: false,
      chargesMax: "0",
      description: ""
    });
    notify(`„${newItem.name}“ hinzugefügt.`);
  };

  const handleDmCreateAndGrantItem = (e) => {
    e.preventDefault();
    const name = dmItemForm.name.trim();
    if (!name) {
      notify("Bitte einen Namen für den Gegenstand eingeben.", "error");
      return;
    }
    const newItem = normalizeInventoryItem({
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      name,
      weight: parseFloat(dmItemForm.weight) || 0,
      qty: Math.max(1, parseInt(dmItemForm.qty, 10) || 1),
      isMagical: !!dmItemForm.isMagical,
      requiresAttunement: !!(dmItemForm.isMagical && dmItemForm.requiresAttunement),
      isAttuned: false,
      chargesMax: Math.max(0, parseInt(dmItemForm.chargesMax, 10) || 0),
      chargesCurrent: Math.max(0, parseInt(dmItemForm.chargesMax, 10) || 0),
      description: dmItemForm.description.trim()
    });

    if (dmInvTarget === "__bag_of_holding") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = newItem.weight * newItem.qty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Warnung: Nimmervoller Beutel überschreitet ${cap} kg!`, "error");
        return;
      }
      setBagOfHolding((prev) => ({ ...prev, items: mergeOrAppendItem(prev.items || [], newItem) }));
      addLog("Nimmervoller Beutel", "inventory", `DM-Beute: ${newItem.qty}× ${newItem.name}`, `${addedKg.toFixed(2)} kg`, "DM");
      notify(`„${newItem.name}“ in den Nimmervollen Beutel gelegt.`);
    } else {
      const targetChar = characters.find((c) => c.id === dmInvTarget);
      if (!targetChar) {
        notify("Ziel-Charakter nicht gefunden.", "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === targetChar.id ? { ...c, inventory: mergeOrAppendItem(c.inventory || [], newItem) } : c));
      addLog(targetChar.name, "inventory", `DM-Beute erhalten: ${newItem.qty}× ${newItem.name}`, `${(newItem.weight * newItem.qty).toFixed(2)} kg`, "DM");
      notify(`„${newItem.name}“ an ${targetChar.name} vergeben.`);
    }

    setDmItemForm({
      name: "",
      weight: "0.5",
      qty: "1",
      isMagical: false,
      requiresAttunement: false,
      chargesMax: "0",
      description: ""
    });
  };

  // --- MODUL 2: BASTIONS-MANAGER LOGIK (2024 DMG) ---
  const handleSubmitBastionOrder = (room) => {
    const selectedOrderId = roomOrderSelections[room.id] || BASTION_ORDERS[0].id;
    const orderMeta = BASTION_ORDERS.find((o) => o.id === selectedOrderId) || BASTION_ORDERS[0];
    const note = (roomOrderNotes[room.id] || "").trim();
    const actorName = loggedInPlayer ? loggedInPlayer.name : "Spieler";
    const stamp = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

    const orderPayload = {
      orderId: orderMeta.id,
      orderLabel: orderMeta.label,
      submittedBy: actorName,
      note,
      timestamp: stamp
    };

    if (bastion.requireDmApproval) {
      setBastion((prev) => ({
        ...prev,
        rooms: prev.rooms.map((r) => r.id === room.id ? {
          ...r,
          pendingOrder: orderPayload,
          status: "Befehl wartet auf DM-Freigabe"
        } : r)
      }));
      addLog(actorName, "bastion", `Bastions-Befehl angefragt (${room.name}): ${orderMeta.label}`, note || "-", "Spieler");
      notify(`Befehl „${orderMeta.label}“ für ${room.name} zur DM-Freigabe eingereicht.`);
    } else {
      setBastion((prev) => ({
        ...prev,
        rooms: prev.rooms.map((r) => r.id === room.id ? {
          ...r,
          pendingOrder: null,
          approvedOrder: orderPayload,
          status: `Aktiv: ${orderMeta.label}`
        } : r)
      }));
      addLog(actorName, "bastion", `Bastions-Befehl eingetragen (${room.name}): ${orderMeta.label}`, note || "-", "Spieler");
      notify(`Befehl „${orderMeta.label}“ für ${room.name} direkt eingetragen.`);
    }
    setRoomOrderNotes((prev) => ({ ...prev, [room.id]: "" }));
  };

  const handleApproveBastionOrder = (roomId) => {
    const targetRoom = bastion.rooms.find((r) => r.id === roomId);
    if (!targetRoom || !targetRoom.pendingOrder) return;
    const ord = targetRoom.pendingOrder;
    setBastion((prev) => ({
      ...prev,
      rooms: prev.rooms.map((r) => r.id === roomId ? {
        ...r,
        approvedOrder: ord,
        pendingOrder: null,
        status: `Aktiv: ${ord.orderLabel}`
      } : r)
    }));
    addLog("Bastion", "bastion", `Befehl freigegeben (${targetRoom.name}): ${ord.orderLabel}`, ord.submittedBy, "DM");
    notify(`Befehl für „${targetRoom.name}“ freigegeben.`);
  };

  const handleRejectBastionOrder = (roomId) => {
    const targetRoom = bastion.rooms.find((r) => r.id === roomId);
    if (!targetRoom || !targetRoom.pendingOrder) return;
    const ord = targetRoom.pendingOrder;
    setBastion((prev) => ({
      ...prev,
      rooms: prev.rooms.map((r) => r.id === roomId ? {
        ...r,
        pendingOrder: null,
        status: r.approvedOrder ? `Aktiv: ${r.approvedOrder.orderLabel}` : "Bereit"
      } : r)
    }));
    addLog("Bastion", "bastion", `Befehl abgelehnt (${targetRoom.name}): ${ord.orderLabel}`, ord.submittedBy, "DM");
    notify(`Befehl für „${targetRoom.name}“ abgelehnt.`, "error");
  };

  const handleTriggerBastionTurn = () => {
    const activeRooms = bastion.rooms.filter((r) => r.approvedOrder || (!bastion.requireDmApproval && r.pendingOrder));
    if (activeRooms.length === 0 && !window.confirm("Es liegen aktuell keine freigegebenen Raum-Befehle vor. Trotzdem einen neuen Bastions-Zug auslösen (+1 BP Basis-Erhalt)?")) {
      return;
    }

    let totalBpGained = activeRooms.length === 0 ? 1 : 0;
    let totalRecruitsGained = 0;
    const summaryLines = [];

    const updatedRooms = bastion.rooms.map((r) => {
      const execOrder = r.approvedOrder || (!bastion.requireDmApproval ? r.pendingOrder : null);
      if (!execOrder) {
        return { ...r, pendingOrder: null, approvedOrder: null, status: "Bereit" };
      }
      const meta = BASTION_ORDERS.find((o) => o.id === execOrder.orderId) || BASTION_ORDERS[0];
      totalBpGained += meta.bpGain || 0;

      let nextProgress = (r.productionProgress || 0) + (meta.progressGain || 0);
      let nextDefenders = r.defenders || 0;
      let completedNote = "";

      if (meta.recruitGain) {
        nextDefenders += meta.recruitGain;
        totalRecruitsGained += meta.recruitGain;
        completedNote = ` (+${meta.recruitGain} Verteidiger)`;
      }

      if (nextProgress >= (r.productionGoal || 100)) {
        nextProgress = nextProgress - (r.productionGoal || 100);
        completedNote += " [Projekt abgeschlossen!]";
      }

      summaryLines.push(`${r.name}: ${meta.label}${execOrder.note ? ` („${execOrder.note}“)` : ""}${completedNote}`);

      return {
        ...r,
        defenders: nextDefenders,
        productionProgress: Math.max(0, Math.min(100, nextProgress)),
        pendingOrder: null,
        approvedOrder: null,
        status: completedNote.includes("abgeschlossen") ? "Projekt abgeschlossen!" : "Bereit"
      };
    });

    const nextTurn = (bastion.turnNumber || 1) + 1;
    const turnSummary = summaryLines.length > 0
      ? summaryLines.join(" | ")
      : "Keine Spezialbefehle aktiv – Bastion gewartet (+1 BP).";

    const logEntry = {
      id: "bevt_" + Date.now(),
      turn: bastion.turnNumber || 1,
      type: "turn",
      title: `Bastions-Zug #${bastion.turnNumber || 1} ausgewertet`,
      details: turnSummary,
      bpDelta: totalBpGained,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };

    setBastion((prev) => {
      let nextDefList = prev.defendersList || [];
      if (totalRecruitsGained > 0) {
        if (nextDefList.length > 0) {
          nextDefList = nextDefList.map((d, idx) => idx === 0 ? { ...d, count: (d.count || 1) + totalRecruitsGained } : d);
        } else {
          nextDefList = [{ id: "def_" + Date.now(), name: "Bastions-Rekruten", role: "Garnison", count: totalRecruitsGained, status: "Einsatzbereit" }];
        }
      }
      return {
        ...prev,
        turnNumber: nextTurn,
        bastionPoints: Math.max(0, (prev.bastionPoints || 0) + totalBpGained),
        rooms: updatedRooms,
        defendersList: nextDefList,
        eventLog: [logEntry, ...(prev.eventLog || []).slice(0, 49)]
      };
    });

    addLog("Bastion", "bastion", `Bastions-Zug #${bastion.turnNumber || 1} ausgelöst`, `+${totalBpGained} BP`, "DM");
    notify(`Bastions-Zug #${bastion.turnNumber || 1} ausgewertet (+${totalBpGained} BP)!`);
  };

  const handleRollBastionEvent = () => {
    const roll = Math.floor(Math.random() * 100) + 1;
    let chosen = BASTION_EVENTS_TABLE[0];
    if (roll <= 50) chosen = BASTION_EVENTS_TABLE[0];
    else if (roll <= 55) chosen = BASTION_EVENTS_TABLE[1];
    else if (roll <= 58) chosen = BASTION_EVENTS_TABLE[2];
    else if (roll <= 63) chosen = BASTION_EVENTS_TABLE[3];
    else if (roll <= 72) chosen = BASTION_EVENTS_TABLE[4];
    else if (roll <= 76) chosen = BASTION_EVENTS_TABLE[5];
    else if (roll <= 79) chosen = BASTION_EVENTS_TABLE[6];
    else if (roll <= 83) chosen = BASTION_EVENTS_TABLE[7];
    else if (roll <= 91) chosen = BASTION_EVENTS_TABLE[8];
    else if (roll <= 98) chosen = BASTION_EVENTS_TABLE[9];
    else chosen = BASTION_EVENTS_TABLE[10];

    const rollFormatted = roll === 100 ? "00" : String(roll).padStart(2, "0");
    const entry = {
      id: "bevt_" + Date.now(),
      turn: bastion.turnNumber || 1,
      type: "event",
      roll: rollFormatted,
      category: chosen.category,
      title: `W100 [${rollFormatted}]: ${chosen.title}`,
      details: chosen.summary,
      bpDelta: chosen.bpDelta || 0,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };

    setBastion((prev) => {
      const nextBp = Math.max(0, (prev.bastionPoints || 0) + (chosen.bpDelta || 0));
      let nextRooms = prev.rooms;
      let nextDefList = prev.defendersList || [];

      if (chosen.defenderDelta < 0) {
        let remLoss = Math.abs(chosen.defenderDelta);
        nextRooms = prev.rooms.map((r) => {
          if (remLoss > 0 && (r.defenders || 0) > 0) {
            const take = Math.min(r.defenders, remLoss);
            remLoss -= take;
            return { ...r, defenders: r.defenders - take };
          }
          return r;
        });
        if (nextDefList.length > 0 && nextDefList[0].count > 1) {
          nextDefList = nextDefList.map((d, i) => i === 0 ? { ...d, count: Math.max(1, d.count - 1) } : d);
        }
      } else if (chosen.defenderDelta > 0) {
        if (nextRooms.length > 0) {
          nextRooms = nextRooms.map((r, i) => i === 0 ? { ...r, defenders: (r.defenders || 0) + chosen.defenderDelta } : r);
        }
        if (nextDefList.length > 0) {
          nextDefList = nextDefList.map((d, i) => i === 0 ? { ...d, count: (d.count || 1) + chosen.defenderDelta } : d);
        }
      }

      return {
        ...prev,
        bastionPoints: nextBp,
        rooms: nextRooms,
        defendersList: nextDefList,
        eventLog: [entry, ...(prev.eventLog || []).slice(0, 49)]
      };
    });

    addLog("Bastion", "bastion", `Ereignis (W100: ${rollFormatted}): ${chosen.title}`, chosen.bpDelta ? `${chosen.bpDelta > 0 ? "+" : ""}${chosen.bpDelta} BP` : "0 BP", "DM");
    notify(`W100 [${rollFormatted}]: ${chosen.title}`);
  };

  const handleAddBastionRoom = (e) => {
    e.preventDefault();
    const name = newRoomForm.name.trim();
    if (!name) {
      notify("Bitte einen Raumnamen eingeben.", "error");
      return;
    }
    const newRoom = {
      id: "room_" + Date.now(),
      name,
      type: newRoomForm.type === "Basic" ? "Basic" : "Special",
      level: Math.max(1, parseInt(newRoomForm.level, 10) || 5),
      defenders: Math.max(0, parseInt(newRoomForm.defenders, 10) || 0),
      specialist: newRoomForm.specialist.trim(),
      status: "Bereit",
      productionProgress: 0,
      productionGoal: 100,
      description: newRoomForm.description.trim() || "Einrichtung der Bastion nach 2024 DMG.",
      pendingOrder: null,
      approvedOrder: null
    };
    setBastion((prev) => ({
      ...prev,
      rooms: [...prev.rooms, newRoom]
    }));
    setNewRoomForm({ name: "", type: "Special", level: "5", defenders: "0", specialist: "", description: "" });
    addLog("Bastion", "bastion", `Neuer Raum errichtet: ${name} (Stufe ${newRoom.level})`, newRoom.type, "DM");
    notify(`Einrichtung „${name}“ hinzugefügt.`);
  };

  const handleUpdateBastionRoom = (roomId, patch) => {
    setBastion((prev) => ({
      ...prev,
      rooms: prev.rooms.map((r) => r.id === roomId ? { ...r, ...patch } : r)
    }));
  };

  const handleDeleteBastionRoom = (room) => {
    if (!window.confirm(`Einrichtung „${room.name}“ wirklich aus der Bastion entfernen?`)) return;
    setBastion((prev) => ({
      ...prev,
      rooms: prev.rooms.filter((r) => r.id !== room.id)
    }));
    notify(`„${room.name}“ entfernt.`);
  };

  const handleAddDefenderGroup = (e) => {
    e.preventDefault();
    const name = newDefenderForm.name.trim();
    if (!name) return;
    const entry = {
      id: "def_" + Date.now(),
      name,
      role: newDefenderForm.role.trim() || "Garnison",
      count: Math.max(1, parseInt(newDefenderForm.count, 10) || 1),
      status: "Einsatzbereit"
    };
    setBastion((prev) => ({
      ...prev,
      defendersList: [...(prev.defendersList || []), entry]
    }));
    setNewDefenderForm({ name: "", role: "Garnison", count: "2" });
    notify(`Verteidiger-Trupp „${name}“ hinzugefügt.`);
  };

  // --- DM GENEHMIGUNG / ABLEHNUNG FÜR ALLE SPIELER-TRANSAKTIONEN ---
  const handleApproveRequest = (req) => {
    const targetChar = characters.find((c) => c.id === req.charId);
    if (!targetChar) {
      setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
      notify("Charakter existiert nicht mehr.", "error");
      return;
    }

    if (req.type === "manual_expense" || req.type === "lifestyle_pay") {
      const costCp = Math.abs(req.deltaCp || 0);
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? { ...c, coins: copperToCoins(getTotalCopper(c.coins) - costCp) } : c));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        { kind: "single", charId: targetChar.id, deltaCp: costCp }
      );
    } else if (req.type === "shop_purchase") {
      const costCp = Math.abs(req.deltaCp || 0);
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== req.charId) return c;
        const newUpgrades = req.isUpgrade ? [...(c.upgrades || []), req.itemName] : c.upgrades;
        const nextInv = req.isUpgrade ? (c.inventory || []) : mergeOrAppendItem(c.inventory || [], {
          name: req.itemName,
          weight: 0.5,
          qty: 1,
          isMagical: /trank|potion|magisch|zauber/i.test(req.itemName),
          requiresAttunement: false,
          isAttuned: false,
          chargesMax: 0,
          chargesCurrent: 0,
          description: req.itemDesc || "Im Shop erworben."
        });
        return { ...c, coins: copperToCoins(getTotalCopper(c.coins) - costCp), upgrades: newUpgrades, inventory: nextInv };
      }));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        {
          kind: "single",
          charId: targetChar.id,
          deltaCp: costCp,
          removeUpgrade: req.isUpgrade ? req.itemName : null
        }
      );
    } else if (req.type === "transfer") {
      const amountCp = Math.abs(req.deltaCp || 0);
      const receiver = characters.find((c) => c.id === req.targetCharId);
      if (!receiver) {
        notify("Empfänger existiert nicht mehr!", "error");
        return;
      }
      if (getTotalCopper(targetChar.coins) < amountCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen für den Transfer!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id === targetChar.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) - amountCp) };
        if (c.id === receiver.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) + amountCp) };
        return c;
      }));
      addLog(
        targetChar.name,
        "transfer",
        req.title,
        formatCurrency(amountCp, standard),
        "DM-Genehmigt",
        {
          kind: "multi",
          changes: [
            { charId: targetChar.id, deltaCp: amountCp },
            { charId: receiver.id, deltaCp: -amountCp }
          ]
        }
      );
    } else if (req.type === "bank_deposit") {
      const costCp = Math.abs(req.deltaCp || 0);
      const addGp = req.bankNoteAddGp || 0;
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen für den Kreditbrief!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? {
        ...c,

      changes[ch.id] = { next: cur + applied, applied, name: ch.name };
