        const INITIAL_LOGS = [];

        function getTotalCopper(coins) {
            return (
                (coins.pp || 0) * COIN_VALUES.pp +
                (coins.gp || 0) * COIN_VALUES.gp +
                (coins.sp || 0) * COIN_VALUES.sp +
                (coins.cp || 0) * COIN_VALUES.cp
            );
        }

        function copperToCoins(totalCp) {
            let rem = Math.max(0, Math.round(totalCp));
            const pp = Math.floor(rem / COIN_VALUES.pp);
            rem %= COIN_VALUES.pp;
            const gp = Math.floor(rem / COIN_VALUES.gp);
            rem %= COIN_VALUES.gp;
            const sp = Math.floor(rem / COIN_VALUES.sp);
            rem %= COIN_VALUES.sp;
            const cp = rem;
            return { pp, gp, sp, cp };
        }

        function deductCopperFromCoins(coins, costCp) {
            const currentTotal = getTotalCopper(coins);
            if (currentTotal < costCp) return null;
            const newTotal = currentTotal - costCp;
            return copperToCoins(newTotal);
        }

        function formatCurrency(totalCp, standard = 'silver') {
            if (totalCp === 0) return '0 KM';
            const c = copperToCoins(totalCp);
            const parts = [];
            if (c.pp > 0) parts.push(`${c.pp} PM`);
            if (c.gp > 0) parts.push(`${c.gp} GM`);
            if (c.sp > 0) parts.push(`${c.sp} SM`);
            if (c.cp > 0) parts.push(`${c.cp} KM`);
            return parts.join(', ');
        }

        function getItemCostCp(item, standard) {
            if (item.alwaysGold || standard === 'gold') {
                return item.phbUnits * 100;
            } else {
                return item.phbUnits * 10;
            }
        }

        function getCoinWeight(coins) {
            const count = (coins.pp || 0) + (coins.gp || 0) + (coins.sp || 0) + (coins.cp || 0);
            const kg = (count / 50) * 0.5;
            return { count, kg: kg.toFixed(2) };
        }

        function App() {
            const [role, setRole] = useState('player');
            const [standard, setStandard] = useState('silver');
            const [characters, setCharacters] = useState(INITIAL_CHARACTERS);
            const [activeCharId, setActiveCharId] = useState(INITIAL_CHARACTERS[1].id);
            const [shopTabs, setShopTabs] = useState(INITIAL_SHOP_TABS);
            const [logs, setLogs] = useState(INITIAL_LOGS);
            const [pendingRequests, setPendingRequests] = useState([]);
            const [toast, setToast] = useState(null);

            const [dmPassword, setDmPassword] = useState('dm2024');
            const [isDmUnlocked, setIsDmUnlocked] = useState(false);
            const [dmPasswordInput, setDmPasswordInput] = useState('');

            const [loggedInPlayerId, setLoggedInPlayerId] = useState(null);
            const [loginNameInput, setLoginNameInput] = useState('');
            const [loginPasswordInput, setLoginPasswordInput] = useState('');
            const [isPartyUnlocked, setIsPartyUnlocked] = useState(false);
            const [partyPasswordInput, setPartyPasswordInput] = useState('');

            const [playerTab, setPlayerTab] = useState(INITIAL_SHOP_TABS[0].id);
            const [dmTab, setDmTab] = useState('overview');

            const [manualExpenseAmount, setManualExpenseAmount] = useState('');
            const [manualExpenseCoin, setManualExpenseCoin] = useState('sp');
            const [manualExpenseReason, setManualExpenseReason] = useState('');

            const [transferTargetId, setTransferTargetId] = useState(INITIAL_CHARACTERS[0].id);
            const [transferAmount, setTransferAmount] = useState('');
            const [transferCoinType, setTransferCoinType] = useState('gp');
            const [bankAmountGp, setBankAmountGp] = useState('');

            const [lootType, setLootType] = useState('weapons_raw');
            const [lootBaseValue, setLootBaseValue] = useState('');
            const [lootCoinUnit, setLootCoinUnit] = useState('sp');
            const [lootDescription, setLootDescription] = useState('');

            const [dmTargetId, setDmTargetId] = useState('all');
            const [dmCustomTitle, setDmCustomTitle] = useState('');
            const [dmCustomAmount, setDmCustomAmount] = useState('');
            const [dmCustomCoin, setDmCustomCoin] = useState('gp');
            const [dmCustomMode, setDmCustomMode] = useState('deduct');
            const [newCharName, setNewCharName] = useState('');
            const [newCharRole, setNewCharRole] = useState('');
            const [newCharPassword, setNewCharPassword] = useState('1234');
            const [newDmPasswordInput, setNewDmPasswordInput] = useState('');

            const [selectedShopTabId, setSelectedShopTabId] = useState(INITIAL_SHOP_TABS[0].id);
            const [newTabName, setNewTabName] = useState('');
            const [newTabDesc, setNewTabDesc] = useState('');
            const [editingTabName, setEditingTabName] = useState('');
            const [editingTabDesc, setEditingTabDesc] = useState('');

            const [itemForm, setItemForm] = useState({
                id: null,
                name: '',
                phbUnits: '',
                alwaysGold: false,
                isUpgrade: false,
                desc: ''
            });

            const notify = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('dnd55_economy_state_v3');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.characters) setCharacters(parsed.characters);
                        if (parsed.shopTabs && parsed.shopTabs.length > 0) {
                            setShopTabs(parsed.shopTabs);
                            setPlayerTab(parsed.shopTabs[0].id);
                            setSelectedShopTabId(parsed.shopTabs[0].id);
                        }
                        if (parsed.logs) setLogs(parsed.logs);
                        if (parsed.pendingRequests) setPendingRequests(parsed.pendingRequests);
                        if (parsed.standard) setStandard(parsed.standard);
                        if (parsed.dmPassword) setDmPassword(parsed.dmPassword);
                    }

                    const params = new URLSearchParams(window.location.search);
                    const playerParam = params.get('player');
                    if (playerParam) {
                        setRole('player');
                        setLoginNameInput(decodeURIComponent(playerParam));
                    }
                } catch (e) {
                    console.error('Fehler beim Laden:', e);
                }
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem(
                        'dnd55_economy_state_v3',
                        JSON.stringify({ characters, shopTabs, logs, pendingRequests, standard, dmPassword })
                    );
                } catch (e) {
                    console.error('Fehler beim Speichern:', e);
                }
            }, [characters, shopTabs, logs, pendingRequests, standard, dmPassword]);

            const currentEditorShopTab = useMemo(
                () => shopTabs.find((t) => t.id === selectedShopTabId) || shopTabs[0],
                [shopTabs, selectedShopTabId]
            );

            useEffect(() => {
                if (currentEditorShopTab) {
                    setEditingTabName(currentEditorShopTab.name);
                    setEditingTabDesc(currentEditorShopTab.description || '');
                }
            }, [currentEditorShopTab]);

            const loggedInPlayer = useMemo(
                () => characters.find((c) => c.id === loggedInPlayerId && !c.isParty) || null,
                [characters, loggedInPlayerId]
            );

            const partyChar = useMemo(
                () => characters.find((c) => c.isParty) || null,
                [characters]
            );

            const visiblePlayerTabs = useMemo(() => {
                const list = [];
                if (loggedInPlayer) list.push(loggedInPlayer);
                if (partyChar) list.push(partyChar);
                return list;
            }, [loggedInPlayer, partyChar]);

            const activeChar = useMemo(
                () => visiblePlayerTabs.find((c) => c.id === activeCharId) || loggedInPlayer || partyChar || characters[0],
                [visiblePlayerTabs, activeCharId, loggedInPlayer, partyChar, characters]
            );

            const isCurrentTabUnlocked = useMemo(() => {
                if (!loggedInPlayer || !activeChar) return false;
                if (activeChar.id === loggedInPlayer.id) return true;
                if (activeChar.isParty) return isPartyUnlocked;
                return false;
            }, [loggedInPlayer, activeChar, isPartyUnlocked]);

            const addLog = (actor, type, title, amountText, source = 'Spieler') => {
                const newEntry = {
                    id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    actor,
                    type,
                    title,
                    amountText,
                    source,
                    timestamp: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                };
                setLogs((prev) => [newEntry, ...prev.slice(0, 99)]);
            };

            const handlePlayerLogin = (e) => {
                e.preventDefault();
                const query = loginNameInput.trim().toLowerCase();
                if (!query) {
                    notify('Bitte deinen Charakternamen eingeben.', 'error');
                    return;
                }
                const matchedChar = characters.find(
                    (c) => !c.isParty && (c.name.toLowerCase() === query || c.id.toLowerCase() === query)
                );
                if (!matchedChar) {
                    notify('Kein Charakter mit diesem Namen gefunden.', 'error');
                    return;
                }
                const expected = matchedChar.password || '1234';
                if (loginPasswordInput === expected) {
                    setLoggedInPlayerId(matchedChar.id);
                    setActiveCharId(matchedChar.id);
                    setLoginPasswordInput('');
                    setIsPartyUnlocked(false);
                    notify(`Willkommen zurück, ${matchedChar.name}!`);
                } else {
                    notify('Falsches Passwort!', 'error');
                }
            };

            const handlePlayerLogout = () => {
                setLoggedInPlayerId(null);
                setIsPartyUnlocked(false);
                notify('Erfolgreich abgemeldet.');
            };

            const handleUnlockParty = (e) => {
                e.preventDefault();
                if (!partyChar) return;
                const expected = partyChar.password || '1234';
                if (partyPasswordInput === expected) {
                    setIsPartyUnlocked(true);
                    setPartyPasswordInput('');
                    notify('Gruppenkasse freigeschaltet.');
                } else {
                    notify('Falsches Passwort!', 'error');
                }
            };

            const handleCopyInviteLink = (char) => {
                try {
                    const baseUrl = window.location.href.split('?')[0];
                    const inviteUrl = `${baseUrl}?player=${encodeURIComponent(char.name)}`;
                    navigator.clipboard.writeText(inviteUrl);
                    notify(`Link für ${char.name} kopiert! (Passwort: ${char.password || '1234'})`);
                } catch {
                    notify(`Passwort: ${char.password || '1234'}`);
                }
            };

            const handleUnlockDm = (e) => {
                e.preventDefault();
                if (dmPasswordInput === dmPassword) {
                    setIsDmUnlocked(true);
                    setDmPasswordInput('');
                    notify('DM-Zentrale entsperrt.');
                } else {
                    notify('Falsches Masterpasswort!', 'error');
                }
            };

            const handleLockDm = () => {
                setIsDmUnlocked(false);
                setRole('player');
                notify('DM-Zentrale gesperrt.');
            };

            const handleManualExpense = () => {
                const val = parseInt(manualExpenseAmount, 10);
                if (!val || val <= 0) {
                    notify('Bitte gültigen Betrag eingeben.', 'error');
                    return;
                }
                const deltaCp = val * COIN_VALUES[manualExpenseCoin];
                const currentCp = getTotalCopper(activeChar.coins);
                if (currentCp < deltaCp) {
                    notify('Nicht genügend Münzen vorhanden!', 'error');
                    return;
                }
                const updatedCoins = deductCopperFromCoins(activeChar.coins, deltaCp);
                setCharacters((prev) => prev.map((c) => (c.id === activeChar.id ? { ...c, coins: updatedCoins } : c)));
                const coinLabel = COIN_META.find((m) => m.key === manualExpenseCoin)?.short;
                addLog(activeChar.name, 'expense', manualExpenseReason.trim() || 'Ausgabe', `-${val} ${coinLabel}`, 'Spieler');
                setManualExpenseAmount('');
                setManualExpenseReason('');
                notify('Ausgabe verbucht.');
            };

            const handleBuyMarketItem = (item) => {
                const costCp = getItemCostCp(item, standard);
                const updatedCoins = deductCopperFromCoins(activeChar.coins, costCp);
                if (!updatedCoins) {
                    notify('Nicht genug Vermögen für diesen Kauf.', 'error');
                    return;
                }
                setCharacters((prev) =>
                    prev.map((c) => {
                        if (c.id !== activeChar.id) return c;
                        const newUpgrades = item.isUpgrade ? [...(c.upgrades || []), item.name] : c.upgrades;
                        return { ...c, coins: updatedCoins, upgrades: newUpgrades };
                    })
                );
                addLog(activeChar.name, 'expense', `Kauf: ${item.name}`, `-${formatCurrency(costCp, standard)}`, 'Spieler');
                notify(`Gekauft: ${item.name}`);
            };

            const handleTransfer = () => {
                const val = parseInt(transferAmount, 10);
                if (!val || val <= 0) return;
                const deltaCp = val * COIN_VALUES[transferCoinType];
                const senderNewCoins = deductCopperFromCoins(activeChar.coins, deltaCp);
                if (!senderNewCoins) {
                    notify('Nicht genügend Münzen für Transfer.', 'error');
                    return;
                }
                const targetChar = characters.find((c) => c.id === transferTargetId);
                if (!targetChar) return;
                setCharacters((prev) =>
                    prev.map((c) => {
                        if (c.id === activeChar.id) return { ...c, coins: senderNewCoins };
                        if (c.id === targetChar.id) {
                            return { ...c, coins: copperToCoins(getTotalCopper(c.coins) + deltaCp) };
                        }
                        return c;
                    })
                );
                const coinLabel = COIN_META.find((m) => m.key === transferCoinType)?.short;
                addLog(activeChar.name, 'transfer', `Transfer an ${targetChar.name}`, `${val} ${coinLabel}`, 'Spieler');
                setTransferAmount('');
                notify('Überweisung erfolgreich.');
            };

            const handleBankAction = (mode) => {
                const gpVal = parseInt(bankAmountGp, 10);
                if (!gpVal || gpVal <= 0) return;
                if (mode === 'deposit') {
                    const feeGp = Math.max(1, Math.ceil(gpVal * 0.03));
                    const totalCostCp = (gpVal + feeGp) * COIN_VALUES.gp;
                    const updatedCoins = deductCopperFromCoins(activeChar.coins, totalCostCp);
                    if (!updatedCoins) {
                        notify('Nicht genug Gold inkl. 3% Bankgebühr.', 'error');
                        return;
                    }
                    setCharacters((prev) =>
                        prev.map((c) =>
                            c.id === activeChar.id ? { ...c, coins: updatedCoins, bankNotesGp: (c.bankNotesGp || 0) + gpVal } : c
                        )
                    );
                    addLog(activeChar.name, 'expense', `Bank-Kreditbrief (+${gpVal} GM)`, `-${gpVal + feeGp} GM`, 'Bank');
                    notify(`Kreditbrief über ${gpVal} GM ausgestellt.`);
                } else {
                    if ((activeChar.bankNotesGp || 0) < gpVal) {
                        notify('Nicht genügend Kreditbrief-Guthaben.', 'error');
                        return;
                    }
                    const req = {
                        id: 'req_' + Date.now(),
                        type: 'bank_withdraw',
                        charId: activeChar.id,
                        charName: activeChar.name,
                        title: `Kreditbrief einlösen (${gpVal} GM)`,
                        payoutCp: gpVal * COIN_VALUES.gp,
                        bankNoteDeductGp: gpVal,
                        timestamp: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                    };
                    setPendingRequests((prev) => [req, ...prev]);
                    notify('Auszahlungsanfrage an DM gesendet.');
                }
                setBankAmountGp('');
            };

            const lootMultiplier = useMemo(() => {
                switch (lootType) {
                    case 'gems': return { factor: 1.0, label: 'Edelsteine (100%)' };
                    case 'art_collector': return { factor: 0.85, label: 'Kunst Sammler (85%)' };
                    case 'art_pawn': return { factor: 0.5, label: 'Kunst Pfandleiher (50%)' };
                    case 'weapons_repaired': return { factor: 0.5, label: 'Aufbereitet (50%)' };
                    case 'weapons_raw': default: return { factor: 0.25, label: 'Rohbeute (25%)' };
                }
            }, [lootType]);

            const calculatedLootPayoutCp = useMemo(() => {
                const raw = parseFloat(lootBaseValue);
                if (!raw || raw <= 0) return 0;
                return Math.floor(raw * COIN_VALUES[lootCoinUnit] * lootMultiplier.factor);
            }, [lootBaseValue, lootCoinUnit, lootMultiplier]);

            const handleRequestLootSale = () => {
                if (calculatedLootPayoutCp <= 0) return;
                const req = {
                    id: 'req_' + Date.now(),
                    type: 'loot_sale',
                    charId: activeChar.id,
                    charName: activeChar.name,
                    title: `Beuteverkauf: ${lootMultiplier.label}`,
                    payoutCp: calculatedLootPayoutCp,
                    bankNoteDeductGp: 0,
                    timestamp: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                };
                setPendingRequests((prev) => [req, ...prev]);
                setLootBaseValue('');
                notify('Verkaufsanfrage an DM gesendet!');
            };

            const handleApproveRequest = (req) => {
                const targetChar = characters.find((c) => c.id === req.charId);
                if (!targetChar) {
                    setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
                    return;
                }
                setCharacters((prev) =>
                    prev.map((c) => {
                        if (c.id !== req.charId) return c;
                        const nextCp = getTotalCopper(c.coins) + req.payoutCp;
                        const nextNotes = req.type === 'bank_withdraw' ? (c.bankNotesGp || 0) - req.bankNoteDeductGp : c.bankNotesGp || 0;
                        return { ...c, coins: copperToCoins(nextCp), bankNotesGp: nextNotes };
                    })
                );
                addLog(targetChar.name, 'income', req.title, `+${formatCurrency(req.payoutCp, standard)}`, 'DM');
                setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
                notify('Anfrage genehmigt.');
            };

            const handleRejectRequest = (req) => {
                setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
                notify('Anfrage abgelehnt.');
            };

            const handleAddShopTab = (e) => {
                e.preventDefault();
                if (!newTabName.trim()) return;
                const newTab = {
                    id: 'tab_' + Date.now(),
                    name: newTabName.trim(),
                    description: newTabDesc.trim() || 'Händlerangebot.',
                    items: []
                };
                setShopTabs((prev) => [...prev, newTab]);
                setSelectedShopTabId(newTab.id);
                setNewTabName('');
                setNewTabDesc('');
                notify('Shop-Reiter erstellt.');
            };

            const handleSaveShopItem = (e) => {
                e.preventDefault();
                if (!currentEditorShopTab) return;
                const priceNum = parseFloat(itemForm.phbUnits);
                if (!itemForm.name.trim() || !priceNum || priceNum <= 0) return;
                setShopTabs((prev) =>
                    prev.map((tab) => {
                        if (tab.id !== currentEditorShopTab.id) return tab;
                        if (itemForm.id) {
                            return {
                                ...tab,
                                items: tab.items.map((it) => (it.id === itemForm.id ? { ...it, ...itemForm, phbUnits: priceNum } : it))
                            };
                        } else {
                            const newItem = { id: 'item_' + Date.now(), ...itemForm, phbUnits: priceNum };
                            return { ...tab, items: [...tab.items, newItem] };
                        }
                    })
                );
                notify('Artikel gespeichert.');
                setItemForm({ id: null, name: '', phbUnits: '', alwaysGold: false, isUpgrade: false, desc: '' });
            };

            const applyDmEventToTargets = (title, calcDeltaCpFn, isIncome = false) => {
                const targets = dmTargetId === 'all' ? characters.filter((c) => !c.isParty) : characters.filter((c) => c.id === dmTargetId);
                setCharacters((prev) =>
                    prev.map((char) => {
                        if (!targets.some((t) => t.id === char.id)) return char;
                        const deltaCp = calcDeltaCpFn(char);
                        if (deltaCp <= 0) return char;
                        const currentCp = getTotalCopper(char.coins);
                        const nextCp = isIncome ? currentCp + deltaCp : Math.max(0, currentCp - deltaCp);
                        addLog(char.name, isIncome ? 'income' : 'dm_event', title, `${isIncome ? '+' : '-'}${formatCurrency(Math.abs(nextCp - currentCp), standard)}`, 'DM');
                        return { ...char, coins: copperToCoins(nextCp) };
                    })
                );
                notify('Ereignis angewendet.');
            };

            const handleExportJson = () => {
                const dataStr = JSON.stringify({ characters, shopTabs, logs, pendingRequests, standard, dmPassword }, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dnd55-wirtschaft.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const currentLifestyleObj = LIFESTYLES.find((l) => l.id === activeChar.lifestyle) || LIFESTYLES[1];
            const currentLifestyleCostCp = standard === 'silver' ? currentLifestyleObj.silverCostCp : currentLifestyleObj.goldCostCp;
            const activeWeight = getCoinWeight(activeChar.coins);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-amber-500/30">
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md ${toast.type === 'error' ? 'bg-red-950/90 border-red-600 text-red-100' : 'bg-emerald-950/90 border-emerald-500 text-emerald-100'}`}>
                            {toast.type === 'error' ? <AlertTriangle className="w-5 h-5 text-red-400" /> : <CheckCircle2 className="w-5 h-5 text-emerald-400" />}
                            <span className="text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    <header className="sticky top-0 z-30 bg-slate-900/95 border-b border-amber-500/20 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 rounded-xl bg-gradient-to-br from-amber-500/20 to-amber-700/20 border border-amber-500/40">
                                    <Coins className="w-6 h-6 text-amber-400" />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight text-amber-100 flex items-center gap-2">
                                        D&D 5.5e Kontor & Schatzkammer
                                        <span className="text-[11px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">2024</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">Wirtschafts- & Kampagnen-Manager</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button onClick={() => setStandard('silver')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${standard === 'silver' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>
                                    <Scale className="w-3.5 h-3.5" /> Silber-Anker
                                </button>
                                <button onClick={() => setStandard('gold')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${standard === 'gold' ? 'bg-amber-600/30 text-amber-300 border border-amber-500/40' : 'text-slate-400'}`}>
                                    <Coins className="w-3.5 h-3.5" /> Gold-Standard
                                </button>
                            </div>

                            <div className="flex items-center gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button onClick={() => setRole('player')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 ${role === 'player' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                                    <Shield className="w-4 h-4" /> Spieler-Ansicht
                                </button>
                                <button onClick={() => setRole('dm')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 ${role === 'dm' ? 'bg-amber-600 text-slate-950' : 'text-slate-400'}`}>
                                    {isDmUnlocked ? <Crown className="w-4 h-4" /> : <Lock className="w-4 h-4" />} DM-Zentrale
                                    {pendingRequests.length > 0 && <span className="ml-1 px-1.5 py-0.2 rounded-full text-[10px] bg-red-600 text-white">{pendingRequests.length}</span>}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-6">
                        {role === 'player' && !loggedInPlayer && (
                            <div className="max-w-md mx-auto my-12 bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 shadow-2xl space-y-5">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center mx-auto">
                                        <UserCheck className="w-6 h-6 text-emerald-400" />
                                    </div>
                                    <h2 className="text-lg font-bold text-white">Spieler-Anmeldung</h2>
                                    <p className="text-xs text-slate-400">Melde dich mit deinem Charakternamen und Passwort an.</p>
                                </div>
                                <form onSubmit={handlePlayerLogin} className="space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Charaktername</label>
                                        <input type="text" placeholder="z.B. Thrain Eisenfaust" value={loginNameInput} onChange={(e) => setLoginNameInput(e.target.value)} className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500" autoFocus />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Passwort</label>
                                        <input type="password" placeholder="Passwort..." value={loginPasswordInput} onChange={(e) => setLoginPasswordInput(e.target.value)} className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500" />
                                    </div>
                                    <button type="submit" className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition">Anmelden</button>
                                </form>
                            </div>
                        )}

                        {role === 'player' && loggedInPlayer && (
                            <div className="space-y-6">
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="text-xs font-semibold text-slate-400 mr-2">Deine Konten:</span>
                                        {visiblePlayerTabs.map((char) => {
                                            const unlocked = char.id === loggedInPlayer.id || (char.isParty && isPartyUnlocked);
                                            return (
                                                <button key={char.id} onClick={() => setActiveCharId(char.id)} className={`px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border ${char.id === activeChar.id ? 'bg-amber-500/15 border-amber-500 text-amber-200' : 'bg-slate-950/70 border-slate-800 text-slate-400'}`}>
                                                    {unlocked ? <Unlock className="w-3.5 h-3.5 text-emerald-400" /> : <Lock className="w-3.5 h-3.5 text-amber-400" />}
                                                    <span>{char.name}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <button onClick={handlePlayerLogout} className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-red-950 border border-slate-700 text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                                        <LogOut className="w-3.5 h-3.5" /> Abmelden
                                    </button>
                                </div>

                                {!isCurrentTabUnlocked ? (
                                    <div className="max-w-md mx-auto my-12 bg-slate-900 border border-amber-500/30 rounded-2xl p-6 shadow-2xl text-center space-y-4">
                                        <KeyRound className="w-8 h-8 text-amber-400 mx-auto" />
                                        <h2 className="text-lg font-bold text-white">Gruppenkasse gesperrt</h2>
                                        <form onSubmit={handleUnlockParty} className="space-y-3">
                                            <input type="password" placeholder="Kassen-Passwort..." value={partyPasswordInput} onChange={(e) => setPartyPasswordInput(e.target.value)} className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-center text-sm text-white" autoFocus />
                                            <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Freischalten</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
                                            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                                    <Coins className="w-5 h-5 text-amber-400" /> {activeChar.name}
                                                </h2>
                                                <span className="text-xs text-slate-400">Gewicht: {activeWeight.kg} kg</span>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                {COIN_META.map((m) => (
                                                    <div key={m.key} className={`p-3.5 rounded-xl border ${m.bg} ${m.border}`}>
                                                        <span className="text-xs text-slate-400">{m.label}</span>
                                                        <div className={`text-2xl font-extrabold mt-1 ${m.color}`}>{activeChar.coins[m.key] || 0}</div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between">
                                                <span>Bargeld-Gesamtwert: <strong className="text-amber-300">{formatCurrency(getTotalCopper(activeChar.coins), standard)}</strong></span>
                                                <span className="text-cyan-300">Kreditbriefe: {activeChar.bankNotesGp || 0} GM</span>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-2">
                                                    <span className="text-xs font-semibold text-slate-300">Ausgabe verbuchen</span>
                                                    <div className="flex gap-2">
                                                        <input type="number" min="1" placeholder="Menge" value={manualExpenseAmount} onChange={(e) => setManualExpenseAmount(e.target.value)} className="w-20 px-2 py-1 rounded bg-slate-900 border border-slate-700 text-sm text-white" />
                                                        <select value={manualExpenseCoin} onChange={(e) => setManualExpenseCoin(e.target.value)} className="px-2 py-1 rounded bg-slate-900 border border-slate-700 text-sm text-white">
                                                            <option value="pp">PM</option><option value="gp">GM</option><option value="sp">SM</option><option value="cp">KM</option>
                                                        </select>
                                                        <input type="text" placeholder="Grund" value={manualExpenseReason} onChange={(e) => setManualExpenseReason(e.target.value)} className="flex-1 px-2 py-1 rounded bg-slate-900 border border-slate-700 text-sm text-white" />
                                                    </div>
                                                    <button onClick={handleManualExpense} className="w-full py-1.5 rounded bg-red-600/20 border border-red-500/40 text-red-300 text-xs font-semibold">Ausgeben</button>
                                                </div>
                                                <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-2">
                                                    <span className="text-xs font-semibold text-slate-300">Überweisen</span>
                                                    <div className="flex gap-2">
                                                        <input type="number" min="1" placeholder="Menge" value={transferAmount} onChange={(e) => setTransferAmount(e.target.value)} className="w-20 px-2 py-1 rounded bg-slate-900 border border-slate-700 text-sm text-white" />
                                                        <select value={transferCoinType} onChange={(e) => setTransferCoinType(e.target.value)} className="px-2 py-1 rounded bg-slate-900 border border-slate-700 text-sm text-white">
                                                            <option value="pp">PM</option><option value="gp">GM</option><option value="sp">SM</option><option value="cp">KM</option>
                                                        </select>
                                                        <select value={transferTargetId} onChange={(e) => setTransferTargetId(e.target.value)} className="flex-1 px-2 py-1 rounded bg-slate-900 border border-slate-700 text-sm text-white">
                                                            {characters.filter(c => c.id !== activeChar.id).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                                        </select>
                                                    </div>
                                                    <button onClick={handleTransfer} className="w-full py-1.5 rounded bg-amber-500/20 border border-amber-500/40 text-amber-200 text-xs font-semibold">Überweisen</button>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                                <Compass className="w-5 h-5 text-emerald-400" /> Lebensstil
                                            </h2>
                                            <div className="p-3.5 rounded-xl bg-emerald-950/20 border border-emerald-500/30">
                                                <span className="text-xs text-slate-400 block">Aktueller Status</span>
                                                <span className="text-base font-bold text-white">{currentLifestyleObj.name}</span>
                                                <div className="text-xs text-amber-400 mt-1">{formatCurrency(currentLifestyleCostCp, standard)} / Woche</div>
                                            </div>
                                            <p className="text-xs text-slate-300">{currentLifestyleObj.description}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {role === 'dm' && !isDmUnlocked && (
                            <div className="max-w-md mx-auto my-12 bg-slate-900 border border-amber-500/40 rounded-2xl p-6 shadow-2xl text-center space-y-4">
                                <Crown className="w-8 h-8 text-amber-400 mx-auto" />
                                <h2 className="text-lg font-bold text-amber-200">DM-Zentrale geschützt</h2>
                                <p className="text-xs text-slate-400">Passwort eingeben (Standard: <strong>dm2024</strong>)</p>
                                <form onSubmit={handleUnlockDm} className="space-y-3">
                                    <input type="password" placeholder="Masterpasswort..." value={dmPasswordInput} onChange={(e) => setDmPasswordInput(e.target.value)} className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-center text-sm text-white" autoFocus />
                                    <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Entsperren</button>
                                </form>
                            </div>
                        )}

                        {role === 'dm' && isDmUnlocked && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 flex justify-between items-center">
                                    <span className="font-bold text-amber-200">Spielleiter-Zentrale (Aktiv)</span>
                                    <div className="flex gap-2">
                                        <button onClick={handleExportJson} className="px-3 py-1.5 rounded bg-slate-800 text-xs text-white">JSON Export</button>
                                        <button onClick={handleLockDm} className="px-3 py-1.5 rounded bg-amber-600 text-xs text-slate-950 font-bold">Sperren</button>
                                    </div>
                                </div>

                                {pendingRequests.length > 0 && (
                                    <div className="bg-emerald-950/25 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                                        <h3 className="text-sm font-bold text-emerald-300">Offene Anfragen ({pendingRequests.length})</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {pendingRequests.map(req => (
                                                <div key={req.id} className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center">
                                                    <div>
                                                        <div className="text-xs font-bold text-white">{req.charName}</div>
                                                        <div className="text-xs text-slate-300">{req.title} (+{formatCurrency(req.payoutCp, standard)})</div>
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <button onClick={() => handleApproveRequest(req)} className="p-2 rounded bg-emerald-600 text-white"><Check className="w-4 h-4" /></button>
                                                        <button onClick={() => handleRejectRequest(req)} className="p-2 rounded bg-red-900 text-white"><X className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                                    <h3 className="text-base font-bold text-white">Charaktere & Passwörter</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs">
                                            <thead>
                                                <tr className="border-b border-slate-800 text-slate-400">
                                                    <th className="py-2">Name</th>
                                                    <th className="py-2">Passwort</th>
                                                    <th className="py-2">Münzen</th>
                                                    <th className="py-2 text-right">Link kopieren</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800">
                                                {characters.map(c => (
                                                    <tr key={c.id}>
                                                        <td className="py-3 font-bold">{c.name}</td>
                                                        <td className="py-3 font-mono text-amber-300">{c.password || '1234'}</td>
                                                        <td className="py-3 font-mono">{c.coins.gp} GM, {c.coins.sp} SM</td>
                                                        <td className="py-3 text-right">
                                                            {!c.isParty && <button onClick={() => handleCopyInviteLink(c)} className="px-2 py-1 rounded bg-emerald-900 text-emerald-200 text-xs">Link</button>}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
