const renderIconNode = (n, key) => {
  const tag = n[0];
  const attrs = n[1] && typeof n[1] === "object" && !Array.isArray(n[1]) ? n[1] : {};
  const kids = Array.isArray(n[2]) ? n[2].map((c, i) => renderIconNode(c, i)) : [];
  return React.createElement(tag, { ...attrs, key }, ...kids);
};
const makeIcon = (...names) => {
  return function IconComponent({ className = "" }) {
    try {
      const icons = window.lucide && window.lucide.icons || {};
      const node = names.map((n) => icons[n]).find(Boolean);
      if (!node || !Array.isArray(node)) return React.createElement("span", { className });
      const children = node[0] === "svg" ? Array.isArray(node[2]) ? node[2] : [] : node;
      return React.createElement(
        "svg",
        {
          xmlns: "http://www.w3.org/2000/svg",
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className
        },
        children.map((c, i) => renderIconNode(c, i))
      );
    } catch (e) {
      return React.createElement("span", { className });
    }
  };
};

      qty: 2,

};
const INITIAL_LOGS = [];

function getTotalCopper(coins) {
  return (coins.pp || 0) * COIN_VALUES.pp + (coins.gp || 0) * COIN_VALUES.gp + (coins.sp || 0) * COIN_VALUES.sp + (coins.cp || 0) * COIN_VALUES.cp;
}
function copperToCoins(totalCp) {
  let rem = Math.max(0, Math.round(totalCp));
  const pp = Math.floor(rem / COIN_VALUES.pp);
  rem %= COIN_VALUES.pp;
  const gp = Math.floor(rem / COIN_VALUES.gp);
  rem %= COIN_VALUES.gp;
  const sp = Math.floor(rem / COIN_VALUES.sp);
  rem %= COIN_VALUES.sp;
  const cp = rem;
  return { pp, gp, sp, cp };
}
function formatCurrency(totalCp, standard = "silver") {
  if (totalCp === 0) return "0 KM";
  const c = copperToCoins(totalCp);
  const parts = [];
  if (c.pp > 0) parts.push(`${c.pp} PM`);
  if (c.gp > 0) parts.push(`${c.gp} GM`);
  if (c.sp > 0) parts.push(`${c.sp} SM`);
  if (c.cp > 0) parts.push(`${c.cp} KM`);
  return parts.join(", ");
}
function getItemCostCp(item, standard) {
  if (item.alwaysGold || standard === "gold") {
    return item.phbUnits * 100;
  } else {
    return item.phbUnits * 10;
  }
}
function getCoinWeight(coins) {
  const count = (coins.pp || 0) + (coins.gp || 0) + (coins.sp || 0) + (coins.cp || 0);
  const kgNum = count / 50 * 0.5;
  return { count, kgNum, kg: kgNum.toFixed(2) };
}
function getInventoryItemsWeight(items) {
  return (items || []).reduce((acc, it) => acc + (parseFloat(it.weight) || 0) * (parseInt(it.qty, 10) || 1), 0);
}
function getEncumbranceStats(char, useVariant = false) {
  const str = Math.max(1, parseInt(char.strength, 10) || 10);
  const coinKg = getCoinWeight(char.coins || {}).kgNum;
  const gearKg = getInventoryItemsWeight(char.inventory || []);
  const totalKg = coinKg + gearKg;

  // D&D 5.5e (2024) Regeln: Tragkraft = STR * 7.5 kg (15 lb), Stoßen/Ziehen/Heben = STR * 15 kg (30 lb)
  // Optional PHB Variant Encumbrance: Belastet ab STR * 2.5 kg (-3m Bewegung), Schwer belastet ab STR * 5 kg (-6m Bewegung & Nachteil)
  const carryMaxKg = str * 7.5;
  const pushDragMaxKg = str * 15;
  const variantEncumberedKg = str * 2.5;
  const variantHeavilyKg = str * 5.0;

  let status = "normal";
  let statusLabel = "Unbelastet";
  let speedPenalty = "Kein Malus";
  let barColor = "bg-emerald-500";
  let textColor = "text-emerald-400";

  if (totalKg > pushDragMaxKg) {
    status = "overloaded";
    statusLabel = "Überladen (Bewegungsunfähig)";
    speedPenalty = "Bewegung 0 m (über Hebegrenze!)";
    barColor = "bg-red-600";
    textColor = "text-red-400";
  } else if (totalKg > carryMaxKg) {
    status = "drag_only";
    statusLabel = "Über Tragkraft (Nur Stoßen/Ziehen)";
    speedPenalty = "Bewegung auf 1,5 m (5 Fuß) reduziert";
    barColor = "bg-red-500";
    textColor = "text-red-400";
  } else if (useVariant && totalKg > variantHeavilyKg) {
    status = "heavily_encumbered";
    statusLabel = "Schwer belastet (Variante)";
    speedPenalty = "-6 m (-20 Fuß) Bewegung & Nachteil auf STR/GES/KON";
    barColor = "bg-amber-500";
    textColor = "text-amber-300";
  } else if (useVariant && totalKg > variantEncumberedKg) {
    status = "encumbered";
    statusLabel = "Belastet (Variante)";
    speedPenalty = "-3 m (-10 Fuß) Bewegung";
    barColor = "bg-amber-400";
    textColor = "text-amber-300";
  } else if (totalKg >= carryMaxKg * 0.75) {
    status = "near_limit";
    statusLabel = "Gut beladen (> 75 %)";
    speedPenalty = "Kein Malus (nahe Tragkraftgrenze)";
    barColor = "bg-amber-400";
    textColor = "text-amber-300";
  }

  const pctOfCarry = carryMaxKg > 0 ? Math.min(100, (totalKg / carryMaxKg) * 100) : 0;

  return {
    str,
    coinKg,
    gearKg,
    totalKg,
    carryMaxKg,
    pushDragMaxKg,
    variantEncumberedKg,
    variantHeavilyKg,
    status,
    statusLabel,
    speedPenalty,
    barColor,
    textColor,
    pctOfCarry
  };
}

      clearTimeout(timer);

        const next = {};

          const listKey = k === "logs" || k === "pendingRequests";

      setSyncStatus("live");

      console.error("Firebase Lesefehler:", err);
      clearTimeout(timer);

      deltaCp: -costCp,
      itemName: item.name,
      itemDesc: item.desc || "",
      isUpgrade: !!item.isUpgrade,
      amountDisplay: `-${formatCurrency(costCp, standard)}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    notify(`Kaufanfrage für „${item.name}“ an den DM gesendet!`);
  };

  const handleTransfer = () => {
    const val = parseInt(transferAmount, 10);
    if (!val || val <= 0) return;
    const deltaCp = val * COIN_VALUES[transferCoinType];
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < deltaCp) {
      notify("Nicht genügend Münzen für Transfer.", "error");
      return;
    }
    const targetChar = characters.find((c) => c.id === transferTargetId);
    if (!targetChar) return;
    const coinLabel = (COIN_META.find((m) => m.key === transferCoinType) || {}).short;
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "transfer",
      categoryLabel: "Überweisung",
      charId: activeChar.id,
      charName: activeChar.name,
      targetCharId: targetChar.id,
      targetCharName: targetChar.name,
      title: `Transfer an ${targetChar.name}`,
      details: `Von ${activeChar.name} an ${targetChar.name}: ${val} ${coinLabel} (${formatCurrency(deltaCp, standard)})`,
      deltaCp: deltaCp,
      amountDisplay: `${val} ${coinLabel} → ${targetChar.name}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    setTransferAmount("");
    notify("Überweisungsanfrage an den DM gesendet!");
  };

  const handlePayLifestyle = () => {
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < currentLifestyleCostCp) {
      notify("Nicht genug Münzen für den Wochenunterhalt.", "error");
      return;
    }
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "lifestyle_pay",
      categoryLabel: "Lebensstil",
      charId: activeChar.id,
      charName: activeChar.name,
      title: `Lebensstil: ${currentLifestyleObj.name} (1 Woche)`,
      details: `Wochenunterhalt für Lebensstil „${currentLifestyleObj.name}“ (${currentLifestyleObj.effectBadge})`,
      deltaCp: -currentLifestyleCostCp,
      amountDisplay: `-${formatCurrency(currentLifestyleCostCp, standard)}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    notify("Unterhaltszahlung zur Genehmigung an den DM gesendet!");
  };

  const handleBankAction = (mode) => {
    const gpVal = parseInt(bankAmountGp, 10);
    if (!gpVal || gpVal <= 0) return;
    if (mode === "deposit") {
      const feeGp = Math.max(1, Math.ceil(gpVal * 0.03));
      const totalCostCp = (gpVal + feeGp) * COIN_VALUES.gp;
      if (getTotalCopper(activeChar.coins) < totalCostCp) {
        notify("Nicht genug Gold inkl. 3% Bankgebühr.", "error");
        return;
      }
      const req = {
        id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
        type: "bank_deposit",
        categoryLabel: "Bank-Einzahlung",
        charId: activeChar.id,
        charName: activeChar.name,
        title: `Bank-Kreditbrief ausstellen (+${gpVal} GM)`,
        details: `Einzahlung von ${gpVal} GM + ${feeGp} GM (3% Gebühr) = ${gpVal + feeGp} GM Abzug für Kreditbrief.`,
        deltaCp: -totalCostCp,
        bankNoteAddGp: gpVal,
        amountDisplay: `-${gpVal + feeGp} GM (+${gpVal} GM Brief)`,
        timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
      };
      setPendingRequests((prev) => [req, ...prev]);
      notify("Kreditbrief-Antrag an den DM gesendet!");
    } else {
      if ((activeChar.bankNotesGp || 0) < gpVal) {
        notify("Nicht genügend Kreditbrief-Guthaben.", "error");
        return;
      }
      const req = {
        id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
        type: "bank_withdraw",
        categoryLabel: "Bank-Auszahlung",
        charId: activeChar.id,
        charName: activeChar.name,
        title: `Kreditbrief einlösen (${gpVal} GM)`,
        details: `Auszahlung von ${gpVal} GM in Münzen aus vorhandenem Kreditbrief-Guthaben (${activeChar.bankNotesGp || 0} GM).`,
        payoutCp: gpVal * COIN_VALUES.gp,
        bankNoteDeductGp: gpVal,
        amountDisplay: `+${gpVal} GM`,
        timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
      };
      setPendingRequests((prev) => [req, ...prev]);
      notify("Auszahlungsanfrage an den DM gesendet!");
    }
    setBankAmountGp("");
  };

  const lootMultiplier = useMemo(() => {
    switch (lootType) {
      case "gems":
        return { factor: 1, label: "Edelsteine (100%)" };
      case "art_collector":
        return { factor: 0.85, label: "Kunst Sammler (85%)" };
      case "art_pawn":
        return { factor: 0.5, label: "Kunst Pfandleiher (50%)" };
      case "weapons_repaired":
        return { factor: 0.5, label: "Aufbereitet (50%)" };
      case "weapons_raw":
      default:
        return { factor: 0.25, label: "Rohbeute (25%)" };
    }
  }, [lootType]);
  const calculatedLootPayoutCp = useMemo(() => {
    const raw = parseFloat(lootBaseValue);
    if (!raw || raw <= 0) return 0;
    return Math.floor(raw * COIN_VALUES[lootCoinUnit] * lootMultiplier.factor);
  }, [lootBaseValue, lootCoinUnit, lootMultiplier]);

  const handleRequestLootSale = () => {
    if (calculatedLootPayoutCp <= 0) return;
    const coinLabel = (COIN_META.find((m) => m.key === lootCoinUnit) || {}).short;
    const descPart = lootDescription.trim() ? ` – ${lootDescription.trim()}` : "";
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "loot_sale",
      categoryLabel: "Beuteverkauf",
      charId: activeChar.id,
      charName: activeChar.name,
      title: `Beuteverkauf: ${lootMultiplier.label}${descPart}`,
      details: `Schätzwert: ${lootBaseValue} ${coinLabel} | Faktor: ${lootMultiplier.label} → Auszahlung: ${formatCurrency(calculatedLootPayoutCp, standard)}`,
      payoutCp: calculatedLootPayoutCp,
      bankNoteDeductGp: 0,
      amountDisplay: `+${formatCurrency(calculatedLootPayoutCp, standard)}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    setLootBaseValue("");
    setLootDescription("");
    notify("Verkaufsanfrage an DM gesendet!");
  };

  // --- MODUL 1: INVENTAR, TRAGLAST & ATTUNEMENT LOGIK ---
  const mergeOrAppendItem = (list, newItem) => {
    const norm = normalizeInventoryItem(newItem);
    // Nur nicht-einzigartige / nicht-eingestimmte identische Gegenstände ohne eigene Ladungen stapeln
    if (!norm.requiresAttunement && norm.chargesMax === 0) {
      const existingIdx = list.findIndex(
        (x) =>
          x.name.trim().toLowerCase() === norm.name.trim().toLowerCase() &&
          Math.abs((parseFloat(x.weight) || 0) - norm.weight) < 0.001 &&
          !!x.isMagical === norm.isMagical &&
          !x.isAttuned &&
          (x.chargesMax || 0) === 0
      );
      if (existingIdx !== -1) {
        const copy = list.slice();
        copy[existingIdx] = {
          ...copy[existingIdx],
          qty: (parseInt(copy[existingIdx].qty, 10) || 1) + norm.qty
        };
        return copy;
      }
    }
    return [...list, norm];
  };

  const handleToggleAttunement = (charId, itemId) => {
    const targetChar = characters.find((c) => c.id === charId);
    if (!targetChar) return;
    const item = (targetChar.inventory || []).find((i) => i.id === itemId);
    if (!item || !item.requiresAttunement) return;

    if (!item.isAttuned) {
      const currentAttunedCount = (targetChar.inventory || []).filter((i) => i.requiresAttunement && i.isAttuned).length;
      if (currentAttunedCount >= 3) {
        notify("Maximal 3 eingestimmte Gegenstände möglich! Löse zuerst eine bestehende Einstimmung.", "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => it.id === itemId ? { ...it, isAttuned: true } : it)
        };
      }));
      addLog(targetChar.name, "inventory", `Eingestimmt: ${item.name}`, "Attunement +1", authMode === "dm" ? "DM" : "Spieler");
      notify(`Auf „${item.name}“ eingestimmt (${currentAttunedCount + 1}/3 Slots).`);
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => it.id === itemId ? { ...it, isAttuned: false } : it)
        };
      }));
      addLog(targetChar.name, "inventory", `Einstimmung gelöst: ${item.name}`, "Attunement -1", authMode === "dm" ? "DM" : "Spieler");
      notify(`Einstimmung auf „${item.name}“ gelöst.`);
    }
  };

  const handleAdjustItemCharges = (sourceKind, charId, itemId, delta) => {
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || []).map((it) => {
          if (it.id !== itemId) return it;
          const next = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
          return { ...it, chargesCurrent: next };
        })
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => {
            if (it.id !== itemId) return it;
            const next = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
            return { ...it, chargesCurrent: next };
          })
        };
      }));
    }
  };

  const handleAdjustItemQty = (sourceKind, charId, itemId, delta) => {
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || [])
          .map((it) => it.id === itemId ? { ...it, qty: (it.qty || 1) + delta } : it)
          .filter((it) => it.qty > 0)
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || [])
            .map((it) => it.id === itemId ? { ...it, qty: (it.qty || 1) + delta } : it)
            .filter((it) => it.qty > 0)
        };
      }));
    }
  };

  const handleDeleteInventoryItem = (sourceKind, charId, item) => {
    if (!window.confirm(`„${item.name}“ (${item.qty}x) wirklich aus dem Inventar entfernen?`)) return;
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || []).filter((it) => it.id !== item.id)
      }));
      addLog("Nimmervoller Beutel", "inventory", `Entfernt: ${item.name} (${item.qty}x)`, "-", authMode === "dm" ? "DM" : "Spieler");
    } else {
      const owner = characters.find((c) => c.id === charId);
      setCharacters((prev) => prev.map((c) => c.id === charId ? { ...c, inventory: (c.inventory || []).filter((it) => it.id !== item.id) } : c));
      addLog(owner ? owner.name : "Inventar", "inventory", `Entfernt: ${item.name} (${item.qty}x)`, "-", authMode === "dm" ? "DM" : "Spieler");
    }
    notify(`„${item.name}“ entfernt.`);
  };

  // Gegenstand zwischen Charakteren, Gruppenwagen & Nimmervollem Beutel verschieben
  const handleTransferInventoryItem = (fromKind, fromCharId, item, toDestination, moveQtyRaw) => {
    if (!item || !toDestination) return;
    const maxQty = Math.max(1, parseInt(item.qty, 10) || 1);
    const moveQty = Math.max(1, Math.min(maxQty, parseInt(moveQtyRaw, 10) || 1));

    // Kapazitätsprüfung beim Nimmervollen Beutel (Standard 250 kg / 500 lb)
    if (toDestination === "__bag_of_holding") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = (parseFloat(item.weight) || 0) * moveQty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Nimmervoller Beutel überladen! (${(currentBagKg + addedKg).toFixed(1)} / ${cap} kg – Beutel würde reißen!)`, "error");
        return;
      }
    }

    const movedItemCopy = normalizeInventoryItem({
      ...item,
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      qty: moveQty,
      // Bei Besitzerwechsel erlischt eine bestehende Einstimmung automatisch nach D&D 5.5e Regeln
      isAttuned: false
    });

    const sourceLabel = fromKind === "bag"
      ? "Nimmervoller Beutel"
      : (characters.find((c) => c.id === fromCharId) || {}).name || "Unbekannt";
    const destLabel = toDestination === "__bag_of_holding"
      ? "Nimmervoller Beutel"
      : (characters.find((c) => c.id === toDestination) || {}).name || "Empfänger";

    // 1. Aus Quelle entfernen / reduzieren
    if (fromKind === "bag") {
      setBagOfHolding((prev) => {
        const reduced = (prev.items || [])
          .map((it) => it.id === item.id ? { ...it, qty: it.qty - moveQty } : it)
          .filter((it) => it.qty > 0);
        return { ...prev, items: reduced };
      });
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== fromCharId) return c;
        const reduced = (c.inventory || [])
          .map((it) => it.id === item.id ? { ...it, qty: it.qty - moveQty } : it)
          .filter((it) => it.qty > 0);
        return { ...c, inventory: reduced };
      }));
    }

    // 2. Zum Ziel hinzufügen
    if (toDestination === "__bag_of_holding") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: mergeOrAppendItem(prev.items || [], movedItemCopy)
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== toDestination) return c;
        return { ...c, inventory: mergeOrAppendItem(c.inventory || [], movedItemCopy) };
      }));
    }

    addLog(
      sourceLabel,
      "inventory",
      `Item-Übergabe: ${moveQty}× ${item.name} → ${destLabel}`,
      `${((parseFloat(item.weight) || 0) * moveQty).toFixed(2)} kg`,
      authMode === "dm" ? "DM" : "Spieler"
    );
    notify(`${moveQty}× „${item.name}“ an ${destLabel} übergeben.`);
  };

  // Spieler fügt eigenen Gegenstand hinzu (z. B. gefundene Alltagsausrüstung / Notiz)
  const handlePlayerAddSelfItem = (e, targetKind, targetCharId) => {
    e.preventDefault();
    const name = playerNewItemForm.name.trim();
    if (!name) {
      notify("Bitte einen Gegenstandsnamen eingeben.", "error");
      return;
    }
    const newItem = normalizeInventoryItem({
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      name,
      weight: parseFloat(playerNewItemForm.weight) || 0,
      qty: Math.max(1, parseInt(playerNewItemForm.qty, 10) || 1),
      isMagical: !!playerNewItemForm.isMagical,
      requiresAttunement: !!(playerNewItemForm.isMagical && playerNewItemForm.requiresAttunement),
      isAttuned: false,
      chargesMax: Math.max(0, parseInt(playerNewItemForm.chargesMax, 10) || 0),
      chargesCurrent: Math.max(0, parseInt(playerNewItemForm.chargesMax, 10) || 0),
      description: playerNewItemForm.description.trim()
    });

    if (targetKind === "bag") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = newItem.weight * newItem.qty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Nimmervoller Beutel würde das Limit von ${cap} kg überschreiten!`, "error");
        return;
      }
      setBagOfHolding((prev) => ({ ...prev, items: mergeOrAppendItem(prev.items || [], newItem) }));
      addLog("Nimmervoller Beutel", "inventory", `Hinzugefügt: ${newItem.qty}× ${newItem.name}`, `${addedKg.toFixed(2)} kg`, "Spieler");
    } else {
      const targetChar = characters.find((c) => c.id === targetCharId);
      setCharacters((prev) => prev.map((c) => c.id === targetCharId ? { ...c, inventory: mergeOrAppendItem(c.inventory || [], newItem) } : c));
      addLog(targetChar ? targetChar.name : "Inventar", "inventory", `Hinzugefügt: ${newItem.qty}× ${newItem.name}`, `${(newItem.weight * newItem.qty).toFixed(2)} kg`, "Spieler");
    }

    setPlayerNewItemForm({
      name: "",
      weight: "0.5",
      qty: "1",
      isMagical: false,
      requiresAttunement: false,
      chargesMax: "0",
      description: ""
    });
    notify(`„${newItem.name}“ hinzugefügt.`);
  };

  // DM erstellt Gegenstand / magische Beute und vergibt sie direkt
  const handleDmCreateAndGrantItem = (e) => {
    e.preventDefault();
    const name = dmItemForm.name.trim();
    if (!name) {
      notify("Bitte einen Namen für den Gegenstand eingeben.", "error");
      return;
    }
    const newItem = normalizeInventoryItem({
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      name,
      weight: parseFloat(dmItemForm.weight) || 0,
      qty: Math.max(1, parseInt(dmItemForm.qty, 10) || 1),
      isMagical: !!dmItemForm.isMagical,
      requiresAttunement: !!(dmItemForm.isMagical && dmItemForm.requiresAttunement),
      isAttuned: false,
      chargesMax: Math.max(0, parseInt(dmItemForm.chargesMax, 10) || 0),
      chargesCurrent: Math.max(0, parseInt(dmItemForm.chargesMax, 10) || 0),
      description: dmItemForm.description.trim()
    });

    if (dmInvTarget === "__bag_of_holding") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = newItem.weight * newItem.qty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Warnung: Nimmervoller Beutel überschreitet ${cap} kg!`, "error");
        return;
      }
      setBagOfHolding((prev) => ({ ...prev, items: mergeOrAppendItem(prev.items || [], newItem) }));
      addLog("Nimmervoller Beutel", "inventory", `DM-Beute: ${newItem.qty}× ${newItem.name}`, `${addedKg.toFixed(2)} kg`, "DM");
      notify(`„${newItem.name}“ in den Nimmervollen Beutel gelegt.`);
    } else {
      const targetChar = characters.find((c) => c.id === dmInvTarget);
      if (!targetChar) {
        notify("Ziel-Charakter nicht gefunden.", "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === targetChar.id ? { ...c, inventory: mergeOrAppendItem(c.inventory || [], newItem) } : c));
      addLog(targetChar.name, "inventory", `DM-Beute erhalten: ${newItem.qty}× ${newItem.name}`, `${(newItem.weight * newItem.qty).toFixed(2)} kg`, "DM");
      notify(`„${newItem.name}“ an ${targetChar.name} vergeben.`);
    }

    setDmItemForm({
      name: "",
      weight: "0.5",
      qty: "1",
      isMagical: false,
      requiresAttunement: false,
      chargesMax: "0",
      description: ""
    });
  };

  // --- DM GENEHMIGUNG / ABLEHNUNG FÜR ALLE SPIELER-TRANSAKTIONEN ---
  const handleApproveRequest = (req) => {
    const targetChar = characters.find((c) => c.id === req.charId);
    if (!targetChar) {
      setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
      notify("Charakter existiert nicht mehr.", "error");
      return;
    }

    if (req.type === "manual_expense" || req.type === "lifestyle_pay") {
      const costCp = Math.abs(req.deltaCp || 0);
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? { ...c, coins: copperToCoins(getTotalCopper(c.coins) - costCp) } : c));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        { kind: "single", charId: targetChar.id, deltaCp: costCp }
      );
    } else if (req.type === "shop_purchase") {
      const costCp = Math.abs(req.deltaCp || 0);
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== req.charId) return c;
        const newUpgrades = req.isUpgrade ? [...(c.upgrades || []), req.itemName] : c.upgrades;
        const nextInv = req.isUpgrade ? (c.inventory || []) : mergeOrAppendItem(c.inventory || [], {
          name: req.itemName,
          weight: 0.5,
          qty: 1,
          isMagical: /trank|potion|magisch|zauber/i.test(req.itemName),
          requiresAttunement: false,
          isAttuned: false,
          chargesMax: 0,
          chargesCurrent: 0,
          description: req.itemDesc || "Im Shop erworben."
        });
        return { ...c, coins: copperToCoins(getTotalCopper(c.coins) - costCp), upgrades: newUpgrades, inventory: nextInv };
      }));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        {
          kind: "single",
          charId: targetChar.id,
          deltaCp: costCp,
          removeUpgrade: req.isUpgrade ? req.itemName : null
        }
      );
    } else if (req.type === "transfer") {
      const amountCp = Math.abs(req.deltaCp || 0);
      const receiver = characters.find((c) => c.id === req.targetCharId);
      if (!receiver) {
        notify("Empfänger existiert nicht mehr!", "error");
        return;
      }
      if (getTotalCopper(targetChar.coins) < amountCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen für den Transfer!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id === targetChar.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) - amountCp) };
        if (c.id === receiver.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) + amountCp) };
        return c;
      }));
      addLog(
        targetChar.name,
        "transfer",
