const renderIconNode = (n, key) => {
  const tag = n[0];
  const attrs = n[1] && typeof n[1] === "object" && !Array.isArray(n[1]) ? n[1] : {};
  const kids = Array.isArray(n[2]) ? n[2].map((c, i) => renderIconNode(c, i)) : [];
  return React.createElement(tag, { ...attrs, key }, ...kids);
};
const makeIcon = (...names) => {
  return function IconComponent({ className = "" }) {
    try {
      const icons = window.lucide && window.lucide.icons || {};
      const node = names.map((n) => icons[n]).find(Boolean);
      if (!node || !Array.isArray(node)) return React.createElement("span", { className });
      const children = node[0] === "svg" ? Array.isArray(node[2]) ? node[2] : [] : node;
      return React.createElement(
        "svg",
        {
          xmlns: "http://www.w3.org/2000/svg",
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className
        },
        children.map((c, i) => renderIconNode(c, i))
      );
    } catch (e) {
      return React.createElement("span", { className });
    }
  };
};

function getTotalCopper(coins) {
  return (coins.pp || 0) * COIN_VALUES.pp + (coins.gp || 0) * COIN_VALUES.gp + (coins.sp || 0) * COIN_VALUES.sp + (coins.cp || 0) * COIN_VALUES.cp;
}
function copperToCoins(totalCp) {
  let rem = Math.max(0, Math.round(totalCp));
  const pp = Math.floor(rem / COIN_VALUES.pp);
  rem %= COIN_VALUES.pp;
  const gp = Math.floor(rem / COIN_VALUES.gp);
  rem %= COIN_VALUES.gp;
  const sp = Math.floor(rem / COIN_VALUES.sp);
  rem %= COIN_VALUES.sp;
  const cp = rem;
  return { pp, gp, sp, cp };
}
function formatCurrency(totalCp, standard = "silver") {
  if (totalCp === 0) return "0 KM";
  const c = copperToCoins(totalCp);
  const parts = [];
  if (c.pp > 0) parts.push(`${c.pp} PM`);
  if (c.gp > 0) parts.push(`${c.gp} GM`);
  if (c.sp > 0) parts.push(`${c.sp} SM`);
  if (c.cp > 0) parts.push(`${c.cp} KM`);
  return parts.join(", ");
}
function getItemCostCp(item, standard) {
  if (item.alwaysGold || standard === "gold") {
    return item.phbUnits * 100;
  } else {
    return item.phbUnits * 10;
  }
}
function getCoinWeight(coins) {
  const count = (coins.pp || 0) + (coins.gp || 0) + (coins.sp || 0) + (coins.cp || 0);
  const kgNum = count / 50 * 0.5;
  return { count, kgNum, kg: kgNum.toFixed(2) };
}
function getInventoryItemsWeight(items) {
  return (items || []).reduce((acc, it) => acc + (parseFloat(it.weight) || 0) * (parseInt(it.qty, 10) || 1), 0);
}
function getEncumbranceStats(char, useVariant = false) {
  const str = Math.max(1, parseInt(char && char.strength, 10) || 10);
  const coinKg = getCoinWeight((char && char.coins) || {}).kgNum;
  const gearKg = getInventoryItemsWeight((char && char.inventory) || []);
  const totalKg = coinKg + gearKg;

  const carryMaxKg = str * 7.5;
  const pushDragMaxKg = str * 15;
  const variantEncumberedKg = str * 2.5;
  const variantHeavilyKg = str * 5.0;

  let status = "normal";
  let statusLabel = "Unbelastet";
  let speedPenalty = "Kein Malus";
  let barColor = "bg-emerald-500";
  let textColor = "text-emerald-400";

  if (totalKg > pushDragMaxKg) {
    status = "overloaded";
    statusLabel = "Überladen (Bewegungsunfähig)";
    speedPenalty = "Bewegung 0 m (über Hebegrenze!)";
    barColor = "bg-red-600";
    textColor = "text-red-400";
  } else if (totalKg > carryMaxKg) {
    status = "drag_only";
    statusLabel = "Über Tragkraft (Nur Ziehen/Schieben)";
    speedPenalty = "Bewegung auf 1,5 m (5 ft) begrenzt";
    barColor = "bg-red-500";
    textColor = "text-red-400";
  } else if (useVariant && totalKg > variantHeavilyKg) {
    status = "heavily_encumbered";
    statusLabel = "Schwer belastet (Variante)";
    speedPenalty = "-6 m (-20 ft) Bewegung & Nachteil auf Attribute/Angriffe/RW";
    barColor = "bg-orange-500";
    textColor = "text-orange-400";
  } else if (useVariant && totalKg > variantEncumberedKg) {
    status = "encumbered";
    statusLabel = "Belastet (Variante)";
    speedPenalty = "-3 m (-10 ft) Bewegung";
    barColor = "bg-amber-500";
    textColor = "text-amber-400";
  }

  return {
    str,
    coinKg,
    gearKg,
    totalKg,
    carryMaxKg,
    pushDragMaxKg,
    variantEncumberedKg,
    variantHeavilyKg,
    status,
    statusLabel,
    speedPenalty,
    barColor,
    textColor
  };
}

const h = React.createElement;

function useSyncedState(key, initialValue) {
  const normalizer = SYNC_NORMALIZERS[key] || ((v) => v);
  const storageKey = "dnd55_" + key;
  const [value, setValueState] = useState(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw !== null) return normalizer(JSON.parse(raw));
    } catch (e) {}
    return normalizer(initialValue);
  });

  const dbRef = useRef(null);
  const remoteLock = useRef(false);

  useEffect(() => {
    if (!FIREBASE_ENABLED || !window.firebase) return;
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const ref = firebase.database().ref(FIREBASE_ROOT + "/" + key);
      dbRef.current = ref;
      const listener = ref.on("value", (snap) => {
        const val = snap.val();
        if (val !== null && val !== undefined) {
          remoteLock.current = true;
          const norm = normalizer(val);
          setValueState(norm);
          try { localStorage.setItem(storageKey, JSON.stringify(norm)); } catch (e) {}
          setTimeout(() => { remoteLock.current = false; }, 0);
        }
      });
      return () => ref.off("value", listener);
    } catch (e) {
      console.warn("Firebase Sync Fallback auf localStorage:", e);
    }
  }, [key]);

  const setValue = (updater) => {
    setValueState((prev) => {
      const nextRaw = typeof updater === "function" ? updater(prev) : updater;
      const next = normalizer(nextRaw);
      try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch (e) {}
      if (dbRef.current && !remoteLock.current) {
        try { dbRef.current.set(cleanForDb(next)); } catch (e) {}
      }
      return next;
    });
  };

  return [value, setValue];
}

  // --- FINANZ-AKTIONEN ---
  const handleApplyCoins = (charId, deltaCoins, sign = 1, customReason = "") => {
    const target = characters.find((c) => c.id === charId);
    if (!target) return;
    const totalDeltaCp =
      sign *
      ((parseInt(deltaCoins.pp, 10) || 0) * COIN_VALUES.pp +
        (parseInt(deltaCoins.gp, 10) || 0) * COIN_VALUES.gp +
        (parseInt(deltaCoins.sp, 10) || 0) * COIN_VALUES.sp +
        (parseInt(deltaCoins.cp, 10) || 0) * COIN_VALUES.cp);
    if (totalDeltaCp === 0) {
      notify("Bitte einen Münzbetrag eingeben.", "warn");
      return;
    }
    const currentCp = getTotalCopper(target.coins);
    if (currentCp + totalDeltaCp < 0) {
      notify("Nicht genug Münzen vorhanden!", "error");
      return;
    }
    const nextCoins = copperToCoins(currentCp + totalDeltaCp);
    setCharacters((prev) => prev.map((c) => (c.id === charId ? { ...c, coins: nextCoins } : c)));
    const label = customReason || (sign > 0 ? "Einnahme / Beute" : "Ausgabe");
    addLog(`${target.name}: ${sign > 0 ? "+" : "-"}${formatCurrency(Math.abs(totalDeltaCp), standard)} (${label})`, "Finanzen");
    setCoinDelta({ pp: 0, gp: 0, sp: 0, cp: 0 });
    setCoinReason("");
    notify("Münzbestand aktualisiert.", "ok");
  };

  const handleBuyShopItem = (item) => {
    if (!activeChar) return;
    const costCp = getItemCostCp(item, standard);
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < costCp) {
      notify(`Zu wenig Guthaben (${formatCurrency(costCp, standard)} benötigt).`, "error");
      return;
    }
    const nextCoins = copperToCoins(currentCp - costCp);
    const invItem = normalizeInventoryItem({
      name: item.name,
      weight: 0.5,
      qty: 1,
      isMagical: !!item.alwaysGold,
      requiresAttunement: false,
      isAttuned: false,
      description: item.desc || ""
    });
    setCharacters((prev) =>
      prev.map((c) =>
        c.id === activeChar.id
          ? {
              ...c,
              coins: nextCoins,
              upgrades: item.isUpgrade ? [...(c.upgrades || []), item.name] : c.upgrades || [],
              inventory: item.isUpgrade ? c.inventory || [] : [...(c.inventory || []), invItem]
            }
          : c
      )
    );
    addLog(`${activeChar.name} kauft "${item.name}" für ${formatCurrency(costCp, standard)}.`, "Shop");
    notify(`Gekauft: ${item.name}`, "ok");
  };

  const handleTransferGold = () => {
    if (!activeChar || activeChar.id === transferToId) return;
    const amountCp = Math.max(0, Math.round((parseFloat(transferGp) || 0) * 100));
    if (amountCp <= 0) return;
    const senderCp = getTotalCopper(activeChar.coins);
    if (senderCp < amountCp) {
      notify("Nicht genügend Münzen für den Transfer.", "error");
      return;
    }
    const receiver = characters.find((c) => c.id === transferToId);
    if (!receiver) return;
    setCharacters((prev) =>
      prev.map((c) => {
        if (c.id === activeChar.id) return { ...c, coins: copperToCoins(senderCp - amountCp) };
        if (c.id === receiver.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) + amountCp) };
        return c;
      })
    );
    addLog(`Transfer: ${activeChar.name} → ${receiver.name} (${formatCurrency(amountCp, standard)})`, "Transfer");
    notify("Transfer erfolgreich.", "ok");

  const handleCreateAndGrantItem = (e) => {

      notify("Bitte einen Gegenstandsnamen eingeben.", "warn");
      return;
    }
    const created = normalizeInventoryItem({
      ...newItemForm,
      chargesCurrent: parseInt(newItemForm.chargesMax, 10) || 0
    });

    if (grantTargetId === "bag_of_holding") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: [...(prev.items || []), created]
      }));
      addLog(`Nimmervoller Beutel erhält: ${created.qty}x ${created.name}`, "Inventar");
    } else {
      const target = characters.find((c) => c.id === grantTargetId);
      if (!target) return;
      setCharacters((prev) =>
        prev.map((c) => (c.id === grantTargetId ? { ...c, inventory: [...(c.inventory || []), created] } : c))
      );
      addLog(`${target.name} erhält Item: ${created.qty}x ${created.name}`, "Inventar");
    }
    setNewItemForm({
      name: "",
      weight: 0.5,
      qty: 1,
      isMagical: false,
      requiresAttunement: false,
      chargesMax: 0,
      description: ""
    });
    notify(`Item "${created.name}" vergeben!`, "ok");
  };

  const handleToggleAttunement = (charId, itemId) => {
    setCharacters((prev) =>
      prev.map((c) => {
        if (c.id !== charId) return c;
        const currentAttuned = (c.inventory || []).filter((it) => it.isAttuned).length;
        const targetItem = (c.inventory || []).find((it) => it.id === itemId);
        if (!targetItem) return c;
        if (!targetItem.isAttuned && currentAttuned >= 3) {
          notify("Maximal 3 eingestimmte Gegenstände (Attunement) erlaubt!", "error");
          return c;
        }
        return {
          ...c,
          inventory: c.inventory.map((it) => (it.id === itemId ? { ...it, isAttuned: !it.isAttuned } : it))
        };
      })
    );
  };

  const handleAdjustCharges = (charId, itemId, delta) => {
    setCharacters((prev) =>
      prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => {
            if (it.id !== itemId) return it;
            const nextCharges = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
            return { ...it, chargesCurrent: nextCharges };
          })
        };
      })
    );
  };

      return;

    setCharacters((prev) =>

    const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
    const itemTotalKg = (parseFloat(item.weight) || 0) * (parseInt(item.qty, 10) || 1);
    if (currentBagKg + itemTotalKg > (bagOfHolding.maxCapacityKg || 250)) {
      notify("Nimmervoller Beutel wäre überladen!", "error");
      return;
    }
    handleDeleteItem(charId, item.id);
    setBagOfHolding((prev) => ({
      ...prev,
      items: [...(prev.items || []), { ...item, isAttuned: false }]

    notify(`"${item.name}" in den Nimmervollen Beutel gelegt.`, "ok");

    const orderObj = {
      orderId: selectedOrderType,
      issuedBy: activeChar ? activeChar.name : "Gruppe",
      note: orderNote.trim() || "Standard-Ausführung"
    };
    setBastion((prev) => ({
      ...prev,
      rooms: prev.rooms.map((r) => {
        if (r.id !== room.id) return r;
        if (prev.requireDmApprovalForOrders && !isDm) {
          return { ...r, pendingOrder: orderObj };
        }
        return { ...r, pendingOrder: null, approvedOrder: orderObj };
      })
    }));
    addLog(`Bastion (${room.name}): Befehl "${selectedOrderType}" erteilt.`, "Bastion");
    setOrderNote("");
    notify(bastion.requireDmApprovalForOrders && !isDm ? "Befehl wartet auf DM-Freigabe." : "Bastions-Befehl aktiv!", "ok");
  };

  const handleApproveRoomOrder = (roomId, approve) => {
    setBastion((prev) => ({
      ...prev,
      rooms: prev.rooms.map((r) => {
        if (r.id !== roomId) return r;
        return {
          ...r,
          approvedOrder: approve ? r.pendingOrder : r.approvedOrder,
          pendingOrder: null
        };
      })
    }));
  };

  const handleAdvanceBastionTurn = () => {
    const roll = Math.floor(Math.random() * 100) + 1;
    const ev = BASTION_RANDOM_EVENTS.find((e) => roll >= e.min && roll <= e.max) || BASTION_RANDOM_EVENTS[0];
    let earnedBp = ev.bpDelta;
    const updatedRooms = bastion.rooms.map((r) => {
      if (!r.approvedOrder) return r;
      const ord = BASTION_ORDERS.find((o) => o.id === r.approvedOrder.orderId);
      earnedBp += ord ? ord.bpGain : 1;
      const nextProg =
        r.approvedOrder.orderId === "Craft" || r.approvedOrder.orderId === "Harvest" || r.approvedOrder.orderId === "Research"
          ? Math.min(r.productionGoal, r.productionProgress + 1)
          : r.productionProgress;
      const nextDef = r.approvedOrder.orderId === "Recruit" ? r.defenders + 1 : r.defenders;
      return {
        ...r,
        productionProgress: nextProg,
        defenders: nextDef,
        approvedOrder: null
      };
    });

    const nextTurn = (bastion.turnNumber || 1) + 1;
    const newEventEntry = {
      id: "bev_" + Date.now(),
      turn: nextTurn,
      roll,
      title: ev.title,
      category: ev.category,
      outcome: ev.outcome,
      timestamp: campaignMeta.currentDate
    };

    setBastion((prev) => ({
      ...prev,
      turnNumber: nextTurn,
      bastionPoints: Math.max(0, (prev.bastionPoints || 0) + earnedBp),
      rooms: updatedRooms,
      eventLog: [newEventEntry, ...(prev.eventLog || [])].slice(0, 30)
    }));
    addLog(`Bastions-Zug #${nextTurn}: W100=${roll} (${ev.title}), +${earnedBp} BP.`, "Bastion");
    notify(`Bastions-Zug #${nextTurn} ausgewertet (+${earnedBp} BP)!`, "ok");
  };

  const handleBuyBastionUpgrade = (shopItem) => {
    const party = characters.find((c) => c.isParty) || characters[0];
    const costCp = (shopItem.costGp || 0) * 100;
    const partyCp = party ? getTotalCopper(party.coins) : 0;
    if (partyCp < costCp) {
      notify(`Gruppenkasse hat nicht genug Gold (${shopItem.costGp} GM benötigt).`, "error");
      return;
    }
    if ((bastion.bastionPoints || 0) < (shopItem.costBp || 0)) {
      notify(`Nicht genug Bastionspunkte (${shopItem.costBp} BP benötigt).`, "error");
      return;
    }
    if (party && costCp > 0) {
      setCharacters((prev) =>
        prev.map((c) => (c.id === party.id ? { ...c, coins: copperToCoins(partyCp - costCp) } : c))
      );
    }
    const newRoom = {
      id: "room_" + Date.now(),
      name: shopItem.name,
      type: shopItem.roomType || "Special",
      level: 1,
      defenders: 0,
      status: "Aktiv",

      description: shopItem.desc || "",
      pendingOrder: null,
      approvedOrder: null

    setBastion((prev) => ({
      ...prev,
      bastionPoints: prev.bastionPoints - (shopItem.costBp || 0),
      rooms: [...prev.rooms, newRoom]

          { className: "bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3" },
          h("h3", { className: "text-sm font-bold text-slate-100" }, "Bastions-Ereignisprotokoll"),
          (bastion.eventLog || []).map((ev) =>
            h(
              "div",
              { key: ev.id, className: "p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs space-y-1" },
              h(
                "div",
                { className: "flex justify-between font-bold text-amber-300" },
                h("span", null, `Zug #${ev.turn}: ${ev.title}`),
                h("span", { className: "text-slate-400" }, `W100: ${ev.roll}`)
              ),
              h("p", { className: "text-slate-400" }, ev.outcome)
            )
          )
        )
      )
    );
  };

  // --- RENDER: PLACEHOLDER-MODULE (FRAKTIONEN, QUESTS, LORE, DOWNTIME) ---
  const renderPlaceholderTab = (tabId) => {
    const info = PLACEHOLDER_INFO[tabId];
    if (!info) return null;
    const points = isDm ? info.dmPoints : info.playerPoints;
    return h(
      "div",
      { className: "bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4" },
      h(
        "div",
        null,
        h("h2", { className: "text-lg font-bold text-amber-300" }, info.title),
        h("p", { className: "text-xs text-slate-400 mt-1" }, isDm ? info.dmSubtitle : info.playerSubtitle)
      ),
      h(
        "ul",
        { className: "space-y-2 text-sm text-slate-300 list-disc pl-5" },
        points.map((pt, idx) => h("li", { key: idx }, pt))
      ),
      h(
        "div",
        { className: "p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-400" },
        "Dieses Kampagnen-Modul ist für deinen nächsten Ausbauschritt vorbereitet."
      )
    );
  };

  return h(
    "div",
    { className: "min-h-screen bg-slate-950 text-slate-100 pb-12" },
    renderHeader(),
    toast &&
      h(
        "div",
        {
          className: `fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-xl ${
            toast.type === "error"
              ? "bg-rose-950 border-rose-500 text-rose-200"
              : toast.type === "warn"
              ? "bg-amber-950 border-amber-500 text-amber-200"
              : "bg-emerald-950 border-emerald-500 text-emerald-200"
          }`
        },
        toast.msg
      ),
    h(
      "main",
      { className: "max-w-7xl mx-auto px-4 pt-6" },
      activeTab === "finances" && renderFinancesTab(),
      activeTab === "inventory" && renderInventoryTab(),
      activeTab === "bastion" && renderBastionTab(),
      (activeTab === "factions" || activeTab === "quests" || activeTab === "lore" || activeTab === "downtime") &&
        renderPlaceholderTab(activeTab)
    )
  );
}

const rootEl = document.getElementById("root");
if (rootEl && window.ReactDOM) {
  ReactDOM.createRoot(rootEl).render(h(App));
}
    </script>
</body>
</html>
