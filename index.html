const renderIconNode = (n, key) => {
  const tag = n[0];
  const attrs = n[1] && typeof n[1] === "object" && !Array.isArray(n[1]) ? n[1] : {};
  const kids = Array.isArray(n[2]) ? n[2].map((c, i) => renderIconNode(c, i)) : [];
  return React.createElement(tag, { ...attrs, key }, ...kids);
};
const makeIcon = (...names) => {
  return function IconComponent({ className = "" }) {
    try {
      const icons = window.lucide && window.lucide.icons || {};
      const node = names.map((n) => icons[n]).find(Boolean);
      if (!node || !Array.isArray(node)) return React.createElement("span", { className });
      const children = node[0] === "svg" ? Array.isArray(node[2]) ? node[2] : [] : node;
      return React.createElement(
        "svg",
        {
          xmlns: "http://www.w3.org/2000/svg",
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className
        },
        children.map((c, i) => renderIconNode(c, i))
      );
    } catch (e) {
      return React.createElement("span", { className });
    }
  };
};

  // Initialisierung & Firebase Realtime Sync
  useEffect(() => {

        if (parsed.characters) setCharacters(SYNC_NORMALIZERS.characters(parsed.characters));

    if (!FIREBASE_ENABLED) {

      console.error("Firebase-SDK nicht geladen.");

      setLoaded(true);
      return;
    }
    let ref;
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      ref = firebase.database().ref(FIREBASE_ROOT);
      dbRef.current = ref;
    } catch (e) {
      console.error("Firebase-Fehler:", e);
      setSyncStatus("error");
      setLoaded(true);
      return;
    }
    const timer = setTimeout(() => {
      setSyncStatus((s) => s === "live" ? s : "error");
      setLoaded(true);
    }, 8000);
    const handleSnapshot = (snap) => {
      clearTimeout(timer);
      const data = snap.val();
      if (data) {
        const next = {};
        SYNC_KEYS.forEach((k) => {
          const listKey = k === "logs" || k === "pendingRequests" || k === "journal";
          if (listKey || data[k] != null) {
            next[k] = SYNC_NORMALIZERS[k](data[k]);
            lastSynced.current[k] = JSON.stringify(next[k]);

        if (next.bagOfHolding) setBagOfHolding(next.bagOfHolding);

      }
      setSyncStatus("live");
      setLoaded(true);
    };
    ref.on("value", handleSnapshot, (err) => {
      console.error("Firebase Lesefehler:", err);
      clearTimeout(timer);
      setSyncStatus("error");
      setLoaded(true);
    });
    return () => {
      clearTimeout(timer);
      ref.off("value", handleSnapshot);
    };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(
        "dnd55_economy_state_v3",
        JSON.stringify({ characters, bagOfHolding, shopTabs, logs, pendingRequests, standard, campaignMeta, dmPassword, bastion, factions, quests, lexicon, craftingProjects, bastionModule, journal })
      );
    } catch (e) {
      console.error("Fehler beim Speichern:", e);
    }
    if (syncStatus !== "live" || !dbRef.current) return;
    const values = { characters, bagOfHolding, shopTabs, logs, pendingRequests, standard, campaignMeta, bastion, factions, quests, lexicon, craftingProjects, bastionModule };
    const updates = {};
    SYNC_KEYS.forEach((k) => {
      if (!(k in values)) return;
      const json = JSON.stringify(values[k]);
      if (lastSynced.current[k] !== json) {
        updates[k] = cleanForDb(values[k]);
        lastSynced.current[k] = json;
      }
    });
    if (Object.keys(updates).length > 0) {
      dbRef.current.update(updates).catch((e) => {
        console.error("Firebase Schreibfehler:", e);
        setSyncStatus("error");
      });

  // ===== Spielleiter-Protokoll: Aktions-Erkennung (jede lokale Änderung wird mit Akteur, Reiter & Details festgehalten) =====
  const jr = useRef({ prev: null, last: { t: 0, label: "" }, pending: null, skip: 0, ctx: {} });
  const journalRef = useRef([]);
  journalRef.current = journal;
  useEffect(() => {
    const rec = (e) => {
      const t = e.target; const el = t && t.closest ? t.closest("button,a,select,input,textarea") : null;
      if (!el) return;
      let label;
      if (el.tagName === "BUTTON" || el.tagName === "A") label = (el.getAttribute("aria-label") || el.title || el.innerText || "").replace(/\s+/g, " ").trim();
      else { const lab = el.closest("label"); label = lab && lab.innerText ? lab.innerText.replace(/\s+/g, " ").trim() : "Eingabe: " + (el.placeholder || el.title || el.name || el.tagName.toLowerCase()); }
      if (!label || label === "✕") label = label === "✕" ? "Entfernen" : "Aktion";
      jr.current.last = { t: Date.now(), label: label.slice(0, 90) };
    };
    const onKey = (e) => { if (e.key === "Enter") rec(e); };
    ["click", "change", "focusout"].forEach((n) => document.addEventListener(n, rec, true));
    document.addEventListener("keydown", onKey, true);
    return () => { ["click", "change", "focusout"].forEach((n) => document.removeEventListener(n, rec, true)); document.removeEventListener("keydown", onKey, true); };
  }, []);
  const pushJournal = (entry) => {
    setJournal((prev) => [entry, ...prev].slice(0, 300));
    const db = dbRef.current;
    if (db && syncStatus === "live") {
      db.child("journal/" + entry.id).set(cleanForDb(entry)).catch(() => {});
      journalRef.current.slice(299).forEach((o) => db.child("journal/" + o.id).remove().catch(() => {}));
    }
  };
  useEffect(() => {
    if (!loaded) return;
    const cur = { characters, shopTabs, standard, campaignMeta, bagOfHolding, bastion, factions, quests, lexicon, craftingProjects, bastionModule, pendingRequests };
    const prev = jr.current.prev; jr.current.prev = cur;
    if (!prev) return;
    const ctx = jr.current.ctx || {};
    if (!ctx.actor) return;
    const ops = [];
    Object.keys(cur).forEach((k) => {
      if (prev[k] === cur[k]) return;
      if (syncStatus === "live" && lastSynced.current[k] === JSON.stringify(cur[k])) return; // stammt vom Live-Sync, nicht von dieser Person
      jdiff(prev[k], cur[k], [], [], k, ops);
    });
    if (!ops.length) return;
    const now = Date.now();
    if (jr.current.skip > now) { jr.current.skip = 0; return; }
    const pend = jr.current.pending && jr.current.pending.until > now ? jr.current.pending : null; jr.current.pending = null;
    if (!pend && now - jr.current.last.t > 2500) return; // automatische Änderung ohne Eingabe (z. B. Normalisierung)
    pushJournal({
      id: "j_" + now.toString(36) + Math.random().toString(36).slice(2, 6), ts: now, actor: ctx.actor, role: ctx.role,
      tab: pend && pend.tab ? pend.tab : ctx.tab || "", title: pend ? pend.title : (jr.current.last.label || "Änderung") + (() => { const nm = ops.find((o) => o.k === "a" || o.k === "d"); return nm && (jr.current.last.label || "").length < 30 ? " – " + nm.d.replace(/^(hinzugefügt|entfernt): /, "") : ""; })(),
      details: ops.slice(0, 40).map((o) => `${JSLICE_NAMES[o.s] || o.s}${o.l ? " › " + o.l : ""}: ${o.d}`).concat(ops.length > 40 ? [`… und ${ops.length - 40} weitere Änderungen`] : []),
      ops, reverted: false, undoOf: pend && pend.undoOf ? pend.undoOf : null
    });
  }, [loaded, characters, shopTabs, standard, campaignMeta, bagOfHolding, bastion, factions, quests, lexicon, craftingProjects, bastionModule, pendingRequests]);

  // Einmalige Übernahme der alten „Unsere Bastion“ (Standorte, Einrichtungen, BP) in das zusammengeführte Bastionen-Modul (nur DM)

    jr.current.skip = Date.now() + 3000;
    const KM = { Luftschiff: "airship", Schiff: "ship", Gildenhalle: "guildhall" };
    setBastionModule((m0) => {
      const m = SYNC_NORMALIZERS.bastionModule(m0);
      const added = b.sites.map((st) => {
        const type = KM[st.kind] || "fortress";
        const facs = b.rooms.filter((r) => r.siteId === st.id).map((r) => {
          const nm = String(r.name || "").toLowerCase();
          const t = m.templates.facilities.find((x) => x.name.toLowerCase().startsWith(nm) || nm.startsWith(x.name.toLowerCase().split(" ")[0]));

        return { id: uid("bastion"), name: st.name, type, tier: 1, maxSlots: Math.max(4, facs.length), owners: A(st.owners), customBpBonus: 0, defenseBonus: 0, baseBpOverride: "", maxFacLevel: "", facilities: facs, garrison: [], missions: [], airshipStats: type === "airship" ? { hullHp: 50, maxHullHp: 50, fuel: 100, maxFuel: 100, baseSpeed: 3, crewMinimum: 10, fuelPerDay: 10, weaponSlots: 2, weapons: [] } : null };

      return { ...m, globalState: { ...m.globalState, bastionPoints: m.globalState.bastionPoints + b.bp }, bastions: [...m.bastions, ...added] };

  // Protokoll mit Undo-Metadaten (undoData)
  const addLog = (actor, type, title, amountText, source = "Spieler", undoData = null) => {
    const newEntry = {
      id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      actor,
      type,
      title,
      amountText,
      source,

    setLogs((prev) => [newEntry, ...prev.slice(0, 99)]);

  // Transaktion im DM-Protokoll rückgängig machen
  const handleUndoLogEntry = (entry) => {
    if (!entry || entry.reverted || !entry.undoData) return;
    if (!window.confirm(`Transaktion „${entry.title}“ (${entry.actor}: ${entry.amountText}) wirklich rückgängig machen?`)) return;

    const u = entry.undoData;
    if (u.kind === "single") {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== u.charId) return c;
        const nextCp = Math.max(0, getTotalCopper(c.coins) + (u.deltaCp || 0));
        const nextNotes = Math.max(0, (c.bankNotesGp || 0) + (u.deltaBankNotesGp || 0));
        let nextUpgrades = c.upgrades || [];
        if (u.removeUpgrade) {
          const idx = nextUpgrades.lastIndexOf(u.removeUpgrade);
          if (idx !== -1) {
            nextUpgrades = nextUpgrades.slice();
            nextUpgrades.splice(idx, 1);
          }
        }
        return {
          ...c,
          coins: copperToCoins(nextCp),
          bankNotesGp: nextNotes,
          upgrades: nextUpgrades,
          ...(u.restoreLifestyle ? { lifestyle: u.restoreLifestyle } : {})
        };
      }));
    } else if (u.kind === "multi" && Array.isArray(u.changes)) {
      setCharacters((prev) => prev.map((c) => {
        const ch = u.changes.find((x) => x.charId === c.id);
        if (!ch) return c;
        const nextCp = Math.max(0, getTotalCopper(c.coins) + (ch.deltaCp || 0));
        return { ...c, coins: copperToCoins(nextCp) };
      }));
    }

    const revertStamp = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    setLogs((prev) => {
      const updated = prev.map((l) => l.id === entry.id ? { ...l, reverted: true } : l);
      const undoNotice = {
        id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        actor: entry.actor,
        type: "dm_event",
        title: `Storniert: ${entry.title}`,
        amountText: "Rückgängig",
        source: "DM-Storno",
        undoData: null,
        reverted: false,
        timestamp: revertStamp
      };
      return [undoNotice, ...updated.slice(0, 99)];
    });
    notify(`Buchung „${entry.title}“ wurde rückgängig gemacht.`);
  };

  // Gold buchen: gp > 0 gutschreiben, gp < 0 abbuchen (mit Eintrag im Finanz-Protokoll)
  const moveGp = (charId, gp, title, src = "DM") => {
    const c = characters.find((x) => x.id === charId);
    if (!c || !gp) return !gp;
    const total = getTotalCopper(c.coins); const cp = Math.round(gp * 100);
    if (total + cp < 0) { notify(`${c.name}: zu wenig Gold (${-gp} GM nötig, ${Math.floor(total / 100)} vorhanden).`, "error"); return false; }
    setCharacters((prev) => prev.map((x) => x.id === charId ? { ...x, coins: copperToCoins(Math.max(0, getTotalCopper(x.coins) + cp)) } : x));
    addLog(c.name, cp < 0 ? "expense" : "dm_event", title, `${cp < 0 ? "-" : "+"}${formatCurrency(Math.abs(cp), standard)}`, src, { kind: "multi", changes: [{ charId, deltaCp: -cp }] });
    return true;
  };

  // --- Spielleiter-Protokoll: Rückgängig machen ---
  jr.current.ctx = { actor: authMode === "dm" ? "Spielleiter (DM-Zentrale)" : loggedInPlayer ? loggedInPlayer.name : "", role: authMode === "dm" ? "DM" : "Spieler", tab: (jr.current.ctx || {}).tab };
  const SLICE_SET = { characters: setCharacters, shopTabs: setShopTabs, standard: setStandard, campaignMeta: setCampaignMeta, bagOfHolding: setBagOfHolding, bastion: setBastion, factions: setFactions, quests: setQuests, lexicon: setLexicon, craftingProjects: setCraftingProjects, bastionModule: setBastionModule, pendingRequests: setPendingRequests };
  const SLICE_VAL = { characters, shopTabs, standard, campaignMeta, bagOfHolding, bastion, factions, quests, lexicon, craftingProjects, bastionModule, pendingRequests };
  const markJournal = (id, patch) => {
    setJournal((prev) => prev.map((x) => x.id === id ? { ...x, ...patch } : x));
    if (dbRef.current && syncStatus === "live") dbRef.current.child("journal/" + id).update(cleanForDb(patch)).catch(() => {});
  };
  const groupOps = (e) => { const g = {}; A(e.ops).forEach((o) => { (g[o.s] = g[o.s] || []).push(o); }); return g; };
  const undoJournalEntries = (entries, title) => {
    entries.forEach((e) => {
      const g = groupOps(e);
      Object.keys(g).forEach((k) => { if (SLICE_SET[k]) SLICE_SET[k]((prev) => jUndo(prev, g[k]).value); });
      markJournal(e.id, { reverted: true, revertedAt: Date.now() });
      if (e.undoOf) markJournal(e.undoOf, { reverted: false });
    });
    jr.current.pending = { title, tab: entries.length === 1 ? entries[0].tab : (jr.current.ctx || {}).tab, undoOf: entries.length === 1 && !entries[0].undoOf ? entries[0].id : null, until: Date.now() + 4000 };
  };
  const handleUndoJournal = (e) => {
    if (!e || e.reverted) return;
    const g = groupOps(e); let conflicts = 0, skipped = 0;
    Object.keys(g).forEach((k) => { const r = jUndo(SLICE_VAL[k], g[k]); conflicts += r.conflicts; skipped += r.skipped; });
    const warn = conflicts || skipped ? `\n\nAchtung: ${conflicts} Wert(e) wurden seit dieser Aktion erneut verändert${skipped ? `, ${skipped} Element(e) existieren nicht mehr (werden übersprungen)` : ""}. Trotzdem zurücksetzen?` : "";
    if (!window.confirm(`Aktion „${e.title}“ von ${e.actor} ${e.undoOf ? "wiederherstellen" : "rückgängig machen"}?${warn}`)) return;
    undoJournalEntries([e], (e.undoOf ? "Wiederhergestellt: " : "Rückgängig: ") + e.title);
    notify(e.undoOf ? "Aktion wiederhergestellt." : "Aktion rückgängig gemacht.");
  };
  const handleRollbackFrom = (e) => {
    const idx = journal.findIndex((x) => x.id === e.id); if (idx < 0) return;
    const list = journal.slice(0, idx + 1).filter((x) => !x.reverted);
    if (!list.length) return;
    if (!window.confirm(`${list.length} Aktion(en) vom Ende des Protokolls bis einschließlich „${e.title}“ zurückrollen (neueste zuerst)?`)) return;
    undoJournalEntries(list, `Zurückgerollt bis: ${e.title} (${list.length} Aktionen)`);
    notify(`${list.length} Aktionen zurückgerollt.`);
  };

  // --- LOGIN / LOGOUT VOR ALLEN REITER-INHALTEN ---
  const handlePlayerLogin = (e) => {
    e.preventDefault();
    const query = loginNameInput.trim().toLowerCase();
    if (!query) {
      notify("Bitte deinen Charakternamen eingeben.", "error");
      return;
    }
    const matchedChar = characters.find(
      (c) => !c.isParty && (c.name.toLowerCase() === query || c.id.toLowerCase() === query)
    );
    if (!matchedChar) {
      notify("Kein Charakter mit diesem Namen gefunden.", "error");
      return;
    }
    const expected = matchedChar.password || "1234";
    if (loginPasswordInput === expected) {
      setLoggedInPlayerId(matchedChar.id);
      setActiveCharId(matchedChar.id);
      setLoginPasswordInput("");
      setIsPartyUnlocked(false);
      setAuthMode("player");
      if (mainSection === "__settings") setMainSection("finances");
      notify(`Willkommen zurück, ${matchedChar.name}!`);
    } else {
      notify("Falsches Passwort!", "error");
    }
  };

  const handleUnlockDm = (e) => {
    e.preventDefault();
    if (dmPasswordInput === dmPassword) {
      setDmPasswordInput("");
      setAuthMode("dm");
      notify("DM-Zentrale entsperrt.");
    } else {
      notify("Falsches Masterpasswort!", "error");
    }
  };

  const handleLogoutAll = () => {
    setAuthMode(null);
    setLoggedInPlayerId(null);
    setIsPartyUnlocked(false);
    setMainSection("finances");
    notify("Erfolgreich abgemeldet.");
  };

  const handleUnlockParty = (e) => {
    e.preventDefault();
    if (!partyChar) return;
    const expected = partyChar.password || "1234";
    if (partyPasswordInput === expected) {
      setIsPartyUnlocked(true);
      setPartyPasswordInput("");
      notify("Gruppenkasse freigeschaltet.");
    } else {
      notify("Falsches Passwort!", "error");
    }
  };

  const handleCopyInviteLink = (char) => {
    try {
      const baseUrl = window.location.href.split("?")[0].split("#")[0];
      const inviteUrl = `${baseUrl}?player=${encodeURIComponent(char.name)}`;
      navigator.clipboard.writeText(inviteUrl);
      notify(`Link für ${char.name} kopiert! (Passwort: ${char.password || "1234"})`);
    } catch {
      notify(`Passwort: ${char.password || "1234"}`);
    }
  };

  // --- SPIELER-AKTIONEN (FINANZEN) ---
  const handleManualExpense = () => {
    const val = parseInt(manualExpenseAmount, 10);
    if (!val || val <= 0) {
      notify("Bitte gültigen Betrag eingeben.", "error");
      return;
    }
    const deltaCp = val * COIN_VALUES[manualExpenseCoin];
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < deltaCp) {
      notify("Nicht genügend Münzen vorhanden!", "error");
      return;
    }
    const coinLabel = (COIN_META.find((m) => m.key === manualExpenseCoin) || {}).short;
    const reason = manualExpenseReason.trim() || "Manuelle Ausgabe";
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "manual_expense",
      categoryLabel: "Ausgabe",
      charId: activeChar.id,
      charName: activeChar.name,
      title: reason,
      details: `Spieler möchte ${val} ${coinLabel} (${formatCurrency(deltaCp, standard)}) ausgeben.`,
      deltaCp: -deltaCp,
      amountDisplay: `-${val} ${coinLabel}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    setManualExpenseAmount("");
    setManualExpenseReason("");
    notify("Ausgabe-Anfrage zur Genehmigung an den DM gesendet!");
  };

  const handleBuyMarketItem = (item, tabId) => {
    const ti = tradeInfo(tabId, activeChar.id);
    if (ti.blocked) {
      notify(`Die Händler der Fraktion „${ti.faction}“ verweigern den Handel – jemand ruft die Wache!`, "error");
      addLog(activeChar.name, "dm_event", `Handel verweigert (${ti.faction})`, "Wache alarmiert", "Fraktions-System");
      return;
    }
    const costCp = applyDisc(getItemCostCp(item, standard), ti.discount);
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < costCp) {
      notify("Nicht genug Vermögen für diesen Kauf.", "error");
      return;
    }
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "shop_purchase",
      categoryLabel: "Shop-Kauf",
      charId: activeChar.id,
      charName: activeChar.name,
      title: `Kauf: ${item.name}`,
      details: `${item.desc || "Händlerware"} | Preis: ${formatCurrency(costCp, standard)}${item.isUpgrade ? " (Charakter-Upgrade)" : " (wird ins Inventar gelegt)"}`,
      deltaCp: -costCp,
      itemName: item.name,
      itemDesc: item.desc || "",
      isUpgrade: !!item.isUpgrade,
      amountDisplay: `-${formatCurrency(costCp, standard)}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    notify(`Kaufanfrage für „${item.name}“ an den DM gesendet!`);
  };

  const handleTransfer = () => {
    const val = parseInt(transferAmount, 10);
    if (!val || val <= 0) return;
    const deltaCp = val * COIN_VALUES[transferCoinType];
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < deltaCp) {
      notify("Nicht genügend Münzen für Transfer.", "error");
      return;
    }
    const targetChar = characters.find((c) => c.id === transferTargetId);
    if (!targetChar) return;
    const coinLabel = (COIN_META.find((m) => m.key === transferCoinType) || {}).short;
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "transfer",
      categoryLabel: "Überweisung",
      charId: activeChar.id,
      charName: activeChar.name,
      targetCharId: targetChar.id,
      targetCharName: targetChar.name,
      title: `Transfer an ${targetChar.name}`,
      details: `Von ${activeChar.name} an ${targetChar.name}: ${val} ${coinLabel} (${formatCurrency(deltaCp, standard)})`,
      deltaCp: deltaCp,
      amountDisplay: `${val} ${coinLabel} → ${targetChar.name}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    setTransferAmount("");
    notify("Überweisungsanfrage an den DM gesendet!");
  };

  const handlePayLifestyle = () => {
    const currentCp = getTotalCopper(activeChar.coins);
    if (currentCp < currentLifestyleCostCp) {
      notify("Nicht genug Münzen für den Wochenunterhalt.", "error");
      return;
    }
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "lifestyle_pay",
      categoryLabel: "Lebensstil",
      charId: activeChar.id,
      charName: activeChar.name,
      title: `Lebensstil: ${currentLifestyleObj.name} (1 Woche)`,
      details: `Wochenunterhalt für Lebensstil „${currentLifestyleObj.name}“ (${currentLifestyleObj.effectBadge})`,
      deltaCp: -currentLifestyleCostCp,
      amountDisplay: `-${formatCurrency(currentLifestyleCostCp, standard)}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    notify("Unterhaltszahlung zur Genehmigung an den DM gesendet!");
  };

  const handleBankAction = (mode) => {
    const gpVal = parseInt(bankAmountGp, 10);
    if (!gpVal || gpVal <= 0) return;
    if (mode === "deposit") {
      const feeGp = Math.max(1, Math.ceil(gpVal * 0.03));
      const totalCostCp = (gpVal + feeGp) * COIN_VALUES.gp;
      if (getTotalCopper(activeChar.coins) < totalCostCp) {
        notify("Nicht genug Gold inkl. 3% Bankgebühr.", "error");
        return;
      }
      const req = {
        id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
        type: "bank_deposit",
        categoryLabel: "Bank-Einzahlung",
        charId: activeChar.id,
        charName: activeChar.name,
        title: `Bank-Kreditbrief ausstellen (+${gpVal} GM)`,
        details: `Einzahlung von ${gpVal} GM + ${feeGp} GM (3% Gebühr) = ${gpVal + feeGp} GM Abzug für Kreditbrief.`,
        deltaCp: -totalCostCp,
        bankNoteAddGp: gpVal,
        amountDisplay: `-${gpVal + feeGp} GM (+${gpVal} GM Brief)`,
        timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
      };
      setPendingRequests((prev) => [req, ...prev]);
      notify("Kreditbrief-Antrag an den DM gesendet!");
    } else {
      if ((activeChar.bankNotesGp || 0) < gpVal) {
        notify("Nicht genügend Kreditbrief-Guthaben.", "error");
        return;
      }
      const req = {
        id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
        type: "bank_withdraw",
        categoryLabel: "Bank-Auszahlung",
        charId: activeChar.id,
        charName: activeChar.name,
        title: `Kreditbrief einlösen (${gpVal} GM)`,
        details: `Auszahlung von ${gpVal} GM in Münzen aus vorhandenem Kreditbrief-Guthaben (${activeChar.bankNotesGp || 0} GM).`,
        payoutCp: gpVal * COIN_VALUES.gp,
        bankNoteDeductGp: gpVal,
        amountDisplay: `+${gpVal} GM`,
        timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
      };
      setPendingRequests((prev) => [req, ...prev]);
      notify("Auszahlungsanfrage an den DM gesendet!");
    }
    setBankAmountGp("");
  };

  const lootMultiplier = useMemo(() => {
    switch (lootType) {
      case "gems":
        return { factor: 1, label: "Edelsteine (100%)" };
      case "art_collector":
        return { factor: 0.85, label: "Kunst Sammler (85%)" };
      case "art_pawn":
        return { factor: 0.5, label: "Kunst Pfandleiher (50%)" };
      case "weapons_repaired":
        return { factor: 0.5, label: "Aufbereitet (50%)" };
      case "weapons_raw":
      default:
        return { factor: 0.25, label: "Rohbeute (25%)" };
    }
  }, [lootType]);
  const calculatedLootPayoutCp = useMemo(() => {
    const raw = parseFloat(lootBaseValue);
    if (!raw || raw <= 0) return 0;
    return Math.floor(raw * COIN_VALUES[lootCoinUnit] * lootMultiplier.factor);
  }, [lootBaseValue, lootCoinUnit, lootMultiplier]);

  const handleRequestLootSale = () => {
    if (calculatedLootPayoutCp <= 0) return;
    const coinLabel = (COIN_META.find((m) => m.key === lootCoinUnit) || {}).short;
    const descPart = lootDescription.trim() ? ` – ${lootDescription.trim()}` : "";
    const req = {
      id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
      type: "loot_sale",
      categoryLabel: "Beuteverkauf",
      charId: activeChar.id,
      charName: activeChar.name,
      title: `Beuteverkauf: ${lootMultiplier.label}${descPart}`,
      details: `Schätzwert: ${lootBaseValue} ${coinLabel} | Faktor: ${lootMultiplier.label} → Auszahlung: ${formatCurrency(calculatedLootPayoutCp, standard)}`,
      payoutCp: calculatedLootPayoutCp,
      bankNoteDeductGp: 0,
      amountDisplay: `+${formatCurrency(calculatedLootPayoutCp, standard)}`,
      timestamp: new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    };
    setPendingRequests((prev) => [req, ...prev]);
    setLootBaseValue("");
    setLootDescription("");
    notify("Verkaufsanfrage an DM gesendet!");
  };

  // --- MODUL 1: INVENTAR, TRAGLAST & ATTUNEMENT LOGIK ---
  const mergeOrAppendItem = (list, newItem) => {
    const norm = normalizeInventoryItem(newItem);
    // Nur nicht-einzigartige / nicht-eingestimmte identische Gegenstände ohne eigene Ladungen stapeln
    if (!norm.requiresAttunement && norm.chargesMax === 0) {
      const existingIdx = list.findIndex(
        (x) =>
          x.name.trim().toLowerCase() === norm.name.trim().toLowerCase() &&
          Math.abs((parseFloat(x.weight) || 0) - norm.weight) < 0.001 &&
          !!x.isMagical === norm.isMagical &&
          !x.isAttuned &&
          (x.chargesMax || 0) === 0
      );
      if (existingIdx !== -1) {
        const copy = list.slice();
        copy[existingIdx] = {
          ...copy[existingIdx],
          qty: (parseInt(copy[existingIdx].qty, 10) || 1) + norm.qty
        };
        return copy;
      }
    }
    return [...list, norm];
  };

  const handleToggleAttunement = (charId, itemId) => {
    const targetChar = characters.find((c) => c.id === charId);
    if (!targetChar) return;
    const item = (targetChar.inventory || []).find((i) => i.id === itemId);
    if (!item || !item.requiresAttunement) return;

    if (!item.isAttuned) {
      const currentAttunedCount = (targetChar.inventory || []).filter((i) => i.requiresAttunement && i.isAttuned).length;
      if (currentAttunedCount >= 3) {
        notify("Maximal 3 eingestimmte Gegenstände möglich! Löse zuerst eine bestehende Einstimmung.", "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => it.id === itemId ? { ...it, isAttuned: true } : it)
        };
      }));
      addLog(targetChar.name, "inventory", `Eingestimmt: ${item.name}`, "Attunement +1", authMode === "dm" ? "DM" : "Spieler");
      notify(`Auf „${item.name}“ eingestimmt (${currentAttunedCount + 1}/3 Slots).`);
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => it.id === itemId ? { ...it, isAttuned: false } : it)
        };
      }));
      addLog(targetChar.name, "inventory", `Einstimmung gelöst: ${item.name}`, "Attunement -1", authMode === "dm" ? "DM" : "Spieler");
      notify(`Einstimmung auf „${item.name}“ gelöst.`);
    }
  };

  const handleAdjustItemCharges = (sourceKind, charId, itemId, delta) => {
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || []).map((it) => {
          if (it.id !== itemId) return it;
          const next = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
          return { ...it, chargesCurrent: next };
        })
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || []).map((it) => {
            if (it.id !== itemId) return it;
            const next = Math.max(0, Math.min(it.chargesMax || 0, (it.chargesCurrent || 0) + delta));
            return { ...it, chargesCurrent: next };
          })
        };
      }));
    }
  };

  const handleAdjustItemQty = (sourceKind, charId, itemId, delta) => {
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || [])
          .map((it) => it.id === itemId ? { ...it, qty: (it.qty || 1) + delta } : it)
          .filter((it) => it.qty > 0)
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== charId) return c;
        return {
          ...c,
          inventory: (c.inventory || [])
            .map((it) => it.id === itemId ? { ...it, qty: (it.qty || 1) + delta } : it)
            .filter((it) => it.qty > 0)
        };
      }));
    }
  };

  const handleDeleteInventoryItem = (sourceKind, charId, item) => {
    if (!window.confirm(`„${item.name}“ (${item.qty}x) wirklich aus dem Inventar entfernen?`)) return;
    if (sourceKind === "bag") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: (prev.items || []).filter((it) => it.id !== item.id)
      }));
      addLog("Nimmervoller Beutel", "inventory", `Entfernt: ${item.name} (${item.qty}x)`, "-", authMode === "dm" ? "DM" : "Spieler");
    } else {
      const owner = characters.find((c) => c.id === charId);
      setCharacters((prev) => prev.map((c) => c.id === charId ? { ...c, inventory: (c.inventory || []).filter((it) => it.id !== item.id) } : c));
      addLog(owner ? owner.name : "Inventar", "inventory", `Entfernt: ${item.name} (${item.qty}x)`, "-", authMode === "dm" ? "DM" : "Spieler");
    }
    notify(`„${item.name}“ entfernt.`);
  };

  // Gegenstand zwischen Charakteren, Gruppenwagen & Nimmervollem Beutel verschieben
  const handleTransferInventoryItem = (fromKind, fromCharId, item, toDestination, moveQtyRaw) => {
    if (!item || !toDestination) return;
    const maxQty = Math.max(1, parseInt(item.qty, 10) || 1);
    const moveQty = Math.max(1, Math.min(maxQty, parseInt(moveQtyRaw, 10) || 1));

    // Kapazitätsprüfung beim Nimmervollen Beutel (Standard 250 kg / 500 lb)
    if (toDestination === "__bag_of_holding") {
      const currentBagKg = getInventoryItemsWeight(bagOfHolding.items || []);
      const addedKg = (parseFloat(item.weight) || 0) * moveQty;
      const cap = bagOfHolding.maxCapacityKg || 250;
      if (currentBagKg + addedKg > cap) {
        notify(`Nimmervoller Beutel überladen! (${(currentBagKg + addedKg).toFixed(1)} / ${cap} kg – Beutel würde reißen!)`, "error");
        return;
      }
    }

    const movedItemCopy = normalizeInventoryItem({
      ...item,
      id: "inv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      qty: moveQty,
      // Bei Besitzerwechsel erlischt eine bestehende Einstimmung automatisch nach D&D 5.5e Regeln
      isAttuned: false
    });

    const sourceLabel = fromKind === "bag"
      ? "Nimmervoller Beutel"
      : (characters.find((c) => c.id === fromCharId) || {}).name || "Unbekannt";
    const destLabel = toDestination === "__bag_of_holding"
      ? "Nimmervoller Beutel"
      : (characters.find((c) => c.id === toDestination) || {}).name || "Empfänger";

    // 1. Aus Quelle entfernen / reduzieren
    if (fromKind === "bag") {
      setBagOfHolding((prev) => {
        const reduced = (prev.items || [])
          .map((it) => it.id === item.id ? { ...it, qty: it.qty - moveQty } : it)
          .filter((it) => it.qty > 0);
        return { ...prev, items: reduced };
      });
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== fromCharId) return c;
        const reduced = (c.inventory || [])
          .map((it) => it.id === item.id ? { ...it, qty: it.qty - moveQty } : it)
          .filter((it) => it.qty > 0);
        return { ...c, inventory: reduced };
      }));
    }

    // 2. Zum Ziel hinzufügen
    if (toDestination === "__bag_of_holding") {
      setBagOfHolding((prev) => ({
        ...prev,
        items: mergeOrAppendItem(prev.items || [], movedItemCopy)
      }));
    } else {
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== toDestination) return c;
        return { ...c, inventory: mergeOrAppendItem(c.inventory || [], movedItemCopy) };
      }));
    }

    addLog(
      sourceLabel,
      "inventory",
      `Item-Übergabe: ${moveQty}× ${item.name} → ${destLabel}`,
      `${((parseFloat(item.weight) || 0) * moveQty).toFixed(2)} kg`,
      authMode === "dm" ? "DM" : "Spieler"

  // Spieler fügt eigenen Gegenstand hinzu (z. B. gefundene Alltagsausrüstung / Notiz)
  const handlePlayerAddSelfItem = (e, targetKind, targetCharId) => {

      const targetChar = characters.find((c) => c.id === targetCharId);

      requiresAttunement: false,

    });

    if (dmInvTarget === "__bag_of_holding") {

      const cap = bagOfHolding.maxCapacityKg || 250;

  // --- DM GENEHMIGUNG / ABLEHNUNG FÜR ALLE SPIELER-TRANSAKTIONEN ---
  const handleApproveRequest = (req) => {
    const targetChar = characters.find((c) => c.id === req.charId);
    if (!targetChar) {
      setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
      notify("Charakter existiert nicht mehr.", "error");
      return;
    }

    if (req.type === "manual_expense" || req.type === "lifestyle_pay") {
      const costCp = Math.abs(req.deltaCp || 0);
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? { ...c, coins: copperToCoins(getTotalCopper(c.coins) - costCp) } : c));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        { kind: "single", charId: targetChar.id, deltaCp: costCp }
      );
    } else if (req.type === "shop_purchase") {
      const costCp = Math.abs(req.deltaCp || 0);
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id !== req.charId) return c;
        const newUpgrades = req.isUpgrade ? [...(c.upgrades || []), req.itemName] : c.upgrades;
        const nextInv = req.isUpgrade ? (c.inventory || []) : mergeOrAppendItem(c.inventory || [], {
          name: req.itemName,
          weight: 0.5,
          qty: 1,
          isMagical: /trank|potion|magisch|zauber/i.test(req.itemName),
          requiresAttunement: false,
          isAttuned: false,
          chargesMax: 0,
          chargesCurrent: 0,
          description: req.itemDesc || "Im Shop erworben."
        });
        return { ...c, coins: copperToCoins(getTotalCopper(c.coins) - costCp), upgrades: newUpgrades, inventory: nextInv };
      }));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        {
          kind: "single",
          charId: targetChar.id,
          deltaCp: costCp,
          removeUpgrade: req.isUpgrade ? req.itemName : null
        }
      );
    } else if (req.type === "transfer") {
      const amountCp = Math.abs(req.deltaCp || 0);
      const receiver = characters.find((c) => c.id === req.targetCharId);
      if (!receiver) {
        notify("Empfänger existiert nicht mehr!", "error");
        return;
      }
      if (getTotalCopper(targetChar.coins) < amountCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen für den Transfer!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => {
        if (c.id === targetChar.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) - amountCp) };
        if (c.id === receiver.id) return { ...c, coins: copperToCoins(getTotalCopper(c.coins) + amountCp) };
        return c;
      }));
      addLog(
        targetChar.name,
        "transfer",
        req.title,
        formatCurrency(amountCp, standard),
        "DM-Genehmigt",
        {
          kind: "multi",
          changes: [
            { charId: targetChar.id, deltaCp: amountCp },
            { charId: receiver.id, deltaCp: -amountCp }
          ]
        }
      );
    } else if (req.type === "bank_deposit") {
      const costCp = Math.abs(req.deltaCp || 0);
      const addGp = req.bankNoteAddGp || 0;
      if (getTotalCopper(targetChar.coins) < costCp) {
        notify(`${targetChar.name} hat nicht mehr genug Münzen für den Kreditbrief!`, "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? {
        ...c,
        coins: copperToCoins(getTotalCopper(c.coins) - costCp),
        bankNotesGp: (c.bankNotesGp || 0) + addGp
      } : c));
      addLog(
        targetChar.name,
        "expense",
        req.title,
        `-${formatCurrency(costCp, standard)}`,
        "DM-Genehmigt",
        { kind: "single", charId: targetChar.id, deltaCp: costCp, deltaBankNotesGp: -addGp }
      );
    } else if (req.type === "bank_withdraw") {
      const deductGp = req.bankNoteDeductGp || 0;
      const payoutCp = req.payoutCp || 0;
      if ((targetChar.bankNotesGp || 0) < deductGp) {
        notify("Nicht mehr genügend Kreditbriefe vorhanden!", "error");
        return;
      }
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? {
        ...c,
        coins: copperToCoins(getTotalCopper(c.coins) + payoutCp),
        bankNotesGp: (c.bankNotesGp || 0) - deductGp
      } : c));
      addLog(
        targetChar.name,
        "income",
        req.title,
        `+${formatCurrency(payoutCp, standard)}`,
        "DM-Genehmigt",
        { kind: "single", charId: targetChar.id, deltaCp: -payoutCp, deltaBankNotesGp: deductGp }
      );
    } else {
      const payoutCp = req.payoutCp || 0;
      setCharacters((prev) => prev.map((c) => c.id === req.charId ? {
        ...c,
        coins: copperToCoins(getTotalCopper(c.coins) + payoutCp)
      } : c));
      addLog(
        targetChar.name,
        "income",
        req.title,
        `+${formatCurrency(payoutCp, standard)}`,
        "DM-Genehmigt",
        { kind: "single", charId: targetChar.id, deltaCp: -payoutCp }
      );
    }

    setPendingRequests((prev) => prev.filter((r) => r.id !== req.id));
    notify(`Genehmigt: ${req.title}`);
  };

  const handleRejectRequest = (req) => {

  // Shop & DM Verwaltung
  const handleAddShopTab = (e) => {

    };

  const handleSaveShopItem = (e) => {

  const handleExportJson = () => {

  const currentLifestyleObj = LIFESTYLES.find((l) => l.id === activeChar.lifestyle) || LIFESTYLES[1];

  const activeWeight = getCoinWeight(activeChar.coins);
  const activeEncumbrance = getEncumbranceStats(activeChar, campaignMeta.useVariantEncumbrance);
  const fmt = (cp) => formatCurrency(cp, standard);

  const inp = "px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500";
  const tabBtn = (on) => `px-3.5 py-2 rounded-xl text-sm font-medium transition border ${on ? "bg-amber-500/15 border-amber-500 text-amber-200" : "bg-slate-950/70 border-slate-800 text-slate-400 hover:text-slate-200"}`;
  const btnPrimary = "px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition disabled:opacity-40 disabled:cursor-not-allowed";
  const btnGhost = "px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition cursor-pointer";
  const btnDanger = "px-3 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900 border border-red-700/50 text-xs font-semibold text-red-200 transition";
  const coinOptions = COIN_META.map((m) => React.createElement("option", { key: m.key, value: m.key }, m.short));

  const handleSetLifestyle = (id) => {
    setCharacters((prev) => prev.map((c) => c.id === activeChar.id ? { ...c, lifestyle: id } : c));
    notify("Lebensstil geändert.");
  };

  const getDmTargets = () => dmTargetId === "all" ? characters.filter((c) => !c.isParty) : characters.filter((c) => c.id === dmTargetId);
  const applyDmChange = (title, deltaFn) => {
    const targets = getDmTargets();
    if (targets.length === 0) {
      notify("Kein Ziel ausgewählt.", "error");
      return;
    }
    const changes = {};
    targets.forEach((ch) => {
      const delta = deltaFn(ch);
      if (!delta) return;
      const cur = getTotalCopper(ch.coins);
      const applied = delta > 0 ? delta : -Math.min(cur, -delta);
      if (!applied) return;
      changes[ch.id] = { next: cur + applied, applied, name: ch.name };
    });
    const ids = Object.keys(changes);
    if (ids.length === 0) {
      notify("Keine Änderung (Betrag 0 oder Konto leer).", "error");
      return;
    }
    setCharacters((prev) => prev.map((c) => changes[c.id] ? { ...c, coins: copperToCoins(changes[c.id].next) } : c));
    ids.forEach((id) => {
      const ch = changes[id];
      addLog(
        ch.name,
        ch.applied > 0 ? "income" : "dm_event",
        title,
        `${ch.applied > 0 ? "+" : "-"}${fmt(Math.abs(ch.applied))}`,
        "DM",
        { kind: "single", charId: id, deltaCp: -ch.applied }
      );
    });
    notify(`„${title}“ bei ${ids.length} Konto/Konten angewendet.`);
  };
  const handleCustomEvent = (e) => {

    const award = dmCustomMode === "award";
    applyDmChange(dmCustomTitle.trim() || (award ? "Belohnung" : "Abzug"), () => award ? unitCp : -unitCp);

    setDmCustomTitle("");

  const handleWeeklyUpkeep = () => {
    applyDmChange("Wochenunterhalt (Lebensstil)", (ch) => {

      return -(standard === "silver" ? l.silverCostCp : l.goldCostCp);
    });

  const handleDistributeParty = () => {
    if (!partyChar) return;
    const players = characters.filter((c) => !c.isParty);
    const total = getTotalCopper(partyChar.coins);
    const share = players.length > 0 ? Math.floor(total / players.length) : 0;
    if (share <= 0) {
      notify("Die Gruppenkasse ist zu leer zum Verteilen.", "error");
      return;
    }
    const undoChanges = [
      { charId: partyChar.id, deltaCp: share * players.length },
      ...players.map((p) => ({ charId: p.id, deltaCp: -share }))
    ];
    setCharacters((prev) => prev.map((c) => c.isParty ? { ...c, coins: copperToCoins(total - share * players.length) } : { ...c, coins: copperToCoins(getTotalCopper(c.coins) + share) }));
    addLog("Gruppenkasse", "transfer", "Gruppenkasse gleichmäßig verteilt", `${fmt(share)} pro Spieler`, "DM", { kind: "multi", changes: undoChanges });
    notify("Gruppenkasse verteilt.");
  };

  const updateChar = (id, patch) => setCharacters((prev) => prev.map((c) => c.id === id ? { ...c, ...patch } : c));
  const updateCharCoin = (id, key, value) => setCharacters((prev) => prev.map((c) => c.id === id ? { ...c, coins: { ...c.coins, [key]: Math.max(0, parseInt(value, 10) || 0) } } : c));
  const handleAddCharacter = (e) => {

  const handleDeleteCharacter = (c) => {

  const handleEditItem = (it) => setItemForm({ id: it.id, name: it.name, phbUnits: String(it.phbUnits), alwaysGold: !!it.alwaysGold, isUpgrade: !!it.isUpgrade, desc: it.desc || "" });

  const handleDeleteShopTab = () => {

  const handleImportJson = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!Array.isArray(d.characters)) throw new Error("Format");
        setCharacters(SYNC_NORMALIZERS.characters(d.characters));
        if (d.bagOfHolding) setBagOfHolding(SYNC_NORMALIZERS.bagOfHolding(d.bagOfHolding));
        if (d.shopTabs && d.shopTabs.length) setShopTabs(SYNC_NORMALIZERS.shopTabs(d.shopTabs));

        if (d.campaignMeta) setCampaignMeta(SYNC_NORMALIZERS.campaignMeta(d.campaignMeta));
        notify("Import erfolgreich.");
      } catch (err) {
        notify("Ungültige Datei.", "error");

    };
    reader.readAsText(file);
    e.target.value = "";
